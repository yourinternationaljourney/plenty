    <div id="rcPrev"></div>
    <div class="small faint">The photo is only used to read the receipt and is not stored anywhere. Uncertain prices are flagged for you to check.</div><div id="rcOut"></div></div>
    <div class="mf"><button class="btn ghost" data-close>Cancel</button><div class="actions"><button class="btn primary" id="rcGo" disabled>${ICONS.spark} Read receipt</button></div></div>`);
  const fi=document.getElementById('rcFile');fi.onchange=()=>{receiptFile=fi.files[0]||null;document.getElementById('rcGo').disabled=!receiptFile;const p=document.getElementById('rcPrev');p.innerHTML='';if(receiptFile){const u=URL.createObjectURL(receiptFile);const im=document.createElement('img');im.className='thumb';im.src=u;im.onload=()=>URL.revokeObjectURL(u);p.appendChild(im)}};
  document.getElementById('rcGo').onclick=async()=>{if(!receiptFile)return;const out=document.getElementById('rcOut');out.innerHTML='<div class="thinking"><span class="sp"></span>Reading the receipt…</div>';document.getElementById('rcGo').disabled=true;
    try{const j=await sampleFn.json(`This image is a grocery receipt. Extract it faithfully. Reply with only JSON: {"store":string,"date":"YYYY-MM-DD" or "","total":number,"tax":number,"discount":number (total of discounts as a positive number),"lines":[{"text":"<line exactly as printed>","name":"<your best plain-English product name>","qty":number,"price":number (line total after any line discount),"category":"<one of ${CATS.join(', ')}>","uncertain":boolean (true if the price or name is hard to read)}]}. Exclude subtotal, tax, payment and loyalty lines from "lines". Never invent prices; use 0 and uncertain:true if unreadable.`,{images:[receiptFile],cache:false});
      const parsed=parseReceiptResult(j);if(!parsed.ok){out.innerHTML=`<div class="note bad">${esc(parsed.error)} Try a sharper photo, or log the total with Quick entry.</div>`;document.getElementById('rcGo').disabled=false;return}
      receiptFile=null;openReceiptConfirm(parsed)}
    catch(e){out.innerHTML=`<div class="note bad">${aiErr(e)}</div>`;document.getElementById('rcGo').disabled=false}}}
function openReceiptConfirm(parsed){const list=buildList();const m=matchReceiptLines(parsed.lines,list);const st={store:parsed.store||S.settings.store||'',date:parsed.date,total:parsed.total,tax:parsed.tax,discount:parsed.discount,rows:m.rows,notPurchased:m.notPurchased.map(n=>({...n,confirm:true})),note:''};const B=budgetSummary();
  const draw=()=>{const sum=st.rows.filter(r=>r.status!=='skip'&&r.status!=='duplicate').reduce((a,r)=>a+(+r.price||0),0);const stated=st.total!=null?st.total:sum;const mismatch=st.total!=null&&Math.abs(st.total-sum)>0.05;
    document.getElementById('modal').innerHTML=`<div class="overlay"><div class="modal wide" role="dialog" aria-modal="true">${mhead('Confirm the receipt','Nothing is saved until you press Save. Fix names, prices and statuses freely.')}<div class="mb">
      <div class="row"><div class="field"><label for="rStore">Store</label><input id="rStore" value="${esc(st.store)}"></div><div class="field"><label for="rDate">Date</label><input id="rDate" type="date" value="${esc(st.date)}"></div><div class="field"><label for="rTotal">Receipt total</label><input id="rTotal" type="number" step="0.01" value="${st.total!=null?st.total:''}"></div><div class="field"><label for="rTax">Tax</label><input id="rTax" type="number" step="0.01" value="${st.tax||''}"></div><div class="field"><label for="rDisc">Discounts</label><input id="rDisc" type="number" step="0.01" value="${st.discount||''}"></div></div>
      ${mismatch?`<div class="note warn">Lines add up to ${money(sum)} but the receipt total reads ${money(st.total)}. Check for a missed or misread line before saving.</div>`:''}
      <div class="rwrap"><table class="rtable"><thead><tr><th>Line</th><th>Qty</th><th class="num">Actual</th><th class="num">Est.</th><th class="num">Diff</th><th>Status</th><th>For</th><th>Category</th><th></th></tr></thead><tbody>
      ${st.rows.map((r,i)=>`<tr><td class="n"><input data-r="${i}" data-f="name" value="${esc(r.name)}" title="${esc(r.text)}">${r.matchName&&r.status!=='unplanned'?`<div class="small faint">planned: ${esc(r.matchName)}</div>`:r.uncertain?'<div class="small" style="color:var(--warn)">check this line</div>':''}</td><td><input data-r="${i}" data-f="qty" type="number" min="1" value="${r.qty}" style="width:56px"></td><td class="num"><input data-r="${i}" data-f="price" type="number" step="0.01" value="${r.price}" style="width:78px;text-align:right;${r.uncertain?'border-color:var(--warn)':''}"></td><td class="num faint">${r.est!=null?money(r.est):'—'}</td><td class="num diff ${r.est!=null?(r.price>r.est?'up':'down'):''}">${r.est!=null?(r.price-r.est>=0?'+':'−')+money(Math.abs(r.price-r.est)):'—'}</td><td><select data-r="${i}" data-f="status"><option value="planned" ${r.status==='planned'?'selected':''}>Purchased as planned</option><option value="unplanned" ${r.status==='unplanned'?'selected':''}>Unplanned purchase</option><option value="duplicate" ${r.status==='duplicate'?'selected':''}>Possible duplicate</option><option value="skip" ${r.status==='skip'?'selected':''}>Not a grocery line</option></select></td><td><select data-r="${i}" data-f="purpose">${PURPOSES.map(([v,l])=>`<option value="${v}" ${(r.purpose||(r.pet?'pet':'week'))===v?'selected':''}>${l}</option>`).join('')}</select></td><td><select data-r="${i}" data-f="category">${CATS.map(c=>`<option ${c===r.category?'selected':''}>${c}</option>`).join('')}</select><div class="small faint">${r.pet?esc(petName()):esc(r.priority)}</div></td><td><button class="btn icon ghost" data-rm="${i}" aria-label="Remove line">${ICONS.x}</button></td></tr>`).join('')}
      </tbody></table></div>
      <div><button class="btn sm" id="rAdd">${ICONS.plus} Add a line</button></div>
      ${st.notPurchased.length?`<div class="card pad"><div class="eyebrow" style="margin-bottom:6px">On the list but not on this receipt</div><div class="small muted" style="margin-bottom:6px">Tick the ones you really did not buy; they stay unticked on the list. Untick if you bought them elsewhere.</div><div class="checks">${st.notPurchased.map((n,i)=>`<label><input type="checkbox" data-np="${i}" ${n.confirm?'checked':''}>${esc(n.name)} <span class="faint">${money(n.est)}${n.pet?' · '+esc(petName()):''}</span></label>`).join('')}</div></div>`:''}
      <div class="impact"><div class="kv"><span>Lines counted</span><b class="num">${money(sum)}</b></div><div class="kv"><span>Estimate for this week</span><b class="num">${money(B.actual)}</b></div><div class="kv total"><span>Saved as actual total</span><b class="num">${money(stated)}</b></div><div class="kv"><span>${stated>B.actual?'Over estimate':'Under estimate'}</span><b class="num" style="color:${stated>B.actual?'var(--bad)':'var(--good)'}">${money(Math.abs(stated-B.actual))}</b></div><div class="small faint">${esc(petName())}'s lines stay in the Pet category. Long-lasting items count in full here and are spread over their life in the normalized weekly cost.</div></div>
      <div class="field"><label for="rNote">Notes</label><input id="rNote" value="${esc(st.note)}" placeholder="optional"></div></div>
      <div class="mf"><button class="btn ghost" data-close>Discard</button><div class="actions"><button class="btn primary" id="rSave">Save receipt</button></div></div></div></div>`;
    const box=document.querySelector('.modal');
    const readAll=()=>{st.store=document.getElementById('rStore').value.trim();st.date=document.getElementById('rDate').value||iso(today());const tv=parseFloat(document.getElementById('rTotal').value);st.total=isNaN(tv)?null:tv;st.tax=parseFloat(document.getElementById('rTax').value)||0;st.discount=parseFloat(document.getElementById('rDisc').value)||0;st.note=document.getElementById('rNote').value;box.querySelectorAll('[data-r]').forEach(el=>{const r=st.rows[+el.dataset.r];if(!r)return;const f=el.dataset.f;if(f==='price'||f==='qty')r[f]=parseFloat(el.value)||0;else r[f]=el.value});box.querySelectorAll('[data-np]').forEach(cb=>{st.notPurchased[+cb.dataset.np].confirm=cb.checked})};
    box.querySelectorAll('select[data-r]').forEach(s=>s.onchange=()=>{readAll();draw()});box.querySelectorAll('input[data-r][data-f="price"]').forEach(s=>s.onchange=()=>{readAll();draw()});
    box.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{readAll();st.rows.splice(+b.dataset.rm,1);draw()});document.getElementById('rAdd').onclick=()=>{readAll();st.rows.push({text:'',name:'',qty:1,price:0,category:'Other',status:'unplanned',priority:'optional',uncertain:false});draw();const last=box.querySelectorAll('[data-f="name"]');last[last.length-1].focus()};
    document.getElementById('rSave').onclick=()=>{readAll();const rows=st.rows.filter(r=>r.name);const sum2=rows.filter(r=>r.status!=='skip'&&r.status!=='duplicate').reduce((a,r)=>a+(+r.price||0),0);const amount=st.total!=null?st.total:sum2;
      const trip={id:uid('t'),date:st.date,store:st.store,amount:Math.round(amount*100)/100,tax:st.tax,discount:st.discount,note:st.note,method:'scan',estimateAtTime:Math.round(B.actual*100)/100,lines:rows.map(r=>({name:r.name,qty:r.qty,price:Math.round((+r.price||0)*100)/100,category:r.category,status:r.status,canon:r.canon,matchKey:r.matchKey,est:r.est,priority:r.priority,pet:!!r.pet||r.purpose==='pet',purpose:r.purpose||(r.pet?'pet':'week'),famKey:r.famKey,needBase:r.needBase}))};
      const wk=week();wk.checked=wk.checked||{};for(const r of rows)if(r.status==='planned'&&r.matchKey){wk.checked[r.matchKey]=true;const L=list.find(l=>l.key===r.matchKey);if(L)markBought(L,st.date)}for(const n of st.notPurchased)if(n.confirm)delete wk.checked[n.key];
      const nPrices=applyReceiptToPrices(trip);saveTrip(trip);closeModal();toast(`Receipt saved: ${money(trip.amount)} at ${trip.store||'the store'}${nPrices?` · ${nPrices} price${nPrices===1?'':'s'} remembered for future estimates`:''}`)}};
  draw()}

/* ================= Weekly Health Check engine (DOM-free) ================= */
/* Supportive, non-diagnostic. Distinguishes planned / purchased / reported. Never counts the pet's food. */
const HEALTH_GOALS=[['balanced','Eat more balanced meals'],['heart','Support heart health'],['cholesterol','Improve cholesterol-conscious choices'],['veg','Eat more vegetables'],['fiber','Eat more fiber'],['snacks','Reduce highly processed snacks'],['protein','Eat enough protein'],['maintain','Maintain weight'],['energy','Improve energy'],['none','No specific goal'],['lose','Lose weight gradually (only if you choose this)']];
const HEALTH_CONSIDERATIONS=[['cholesterol','Cholesterol-conscious eating'],['bloodpressure','Blood-pressure-conscious (less salt)'],['bloodsugar','Blood-sugar-conscious'],['ibs','Sensitive digestion'],['pregnancy','Pregnancy or breastfeeding'],['other','Other (note below)']];
const ACTIVITY_LEVELS=[['low','Mostly sitting'],['light','Lightly active'],['moderate','Moderately active'],['high','Very active']];
const PURPOSES=[['week','For this week'],['stockup','Stock-up item'],['guests','For guests'],['occasion','Special occasion'],['pet','Primarily for the pet'],['notme','Not consumed by me']];
const FOOD_RE={
  veg:/\b(spinach|broccoli|kale|lettuce|rocket|arugula|cabbage|carrot|pepper|capsicum|tomato|cucumber|onion|leek|courgette|zucchini|aubergine|eggplant|mushroom|pea|green bean|bean sprout|celery|cauliflower|sweet potato|potato|pumpkin|squash|beetroot|beet|asparagus|corn|sweetcorn|salad|avocado|parsley|coriander|spring onion|garlic|ginger|chard|bok choy|pak choi|radish|fennel|artichoke|okra|turnip|swede|parsnip|romaine|mixed veg)/i,
  fruit:/\b(apple|banana|berry|berries|blueberr|strawberr|raspberr|orange|mandarin|clementine|grape|pear|peach|plum|mango|pineapple|kiwi|melon|watermelon|lemon|lime|cherry|cherries|apricot|fig|date|pomegranate|nectarine|papaya|fruit)/i,
  wholegrain:/\b(oat|oats|wholegrain|whole grain|wholemeal|whole wheat|brown rice|quinoa|bulgur|barley|buckwheat|rye|wholegrain pasta|whole wheat pasta|spelt|granola|muesli)/i,
  legume:/\b(bean|beans|lentil|chickpea|garbanzo|hummus|tofu|tempeh|edamame|pea protein|black bean|kidney bean|cannellini|butter bean)/i,
  nutsSeeds:/\b(almond|walnut|cashew|pecan|hazelnut|pistachio|peanut|nut|nuts|seed|seeds|chia|flax|linseed|sesame|tahini|pumpkin seed|sunflower seed)/i,
  fish:/\b(salmon|tuna|cod|haddock|mackerel|sardine|trout|prawn|shrimp|fish|seafood|anchov|mussel|squid|crab)/i,
  poultry:/\b(chicken|turkey|poultry)/i,
  eggs:/\b(egg|eggs)\b/i,
  dairy:/\b(yogurt|yoghurt|milk|cheese|cheddar|feta|mozzarella|parmesan|halloumi|cottage|quark|skyr|kefir)/i,
  redMeat:/\b(beef|pork|lamb|steak|mince|veal|venison|burger)\b/i,
  processedMeat:/\b(bacon|sausage|ham|salami|chorizo|pepperoni|hot dog|deli meat|prosciutto|spam|nuggets?)\b/i,
  sweet:/\b(chocolate|candy|sweets|cookie|cookies|biscuit|cake|pastry|croissant|donut|doughnut|ice cream|gelato|muffin|brownie|pudding|jam|nutella|marshmallow|gummy|lolly|toffee|fudge)/i,
  processedSnack:/\b(crisps|chips|pretzel|popcorn chips|cheese puffs|nachos|protein bar|granola bar|cereal bar|energy bar|energy drink|soda|cola|lemonade|fizzy drink|sugary drink|instant noodle|ready meal|frozen pizza|pizza)\b/i,
  unsatFat:/\b(olive oil|rapeseed oil|canola oil|avocado oil|sunflower oil|avocado)\b/i,
  satFat:/\b(butter|cream|lard|ghee|coconut oil|coconut milk|double cream)\b/i
};
const PROTEIN_TYPES=['fish','poultry','eggs','dairy','legume','nutsSeeds','redMeat','processedMeat'];
function classifyFood(name){const n=String(name||'').toLowerCase();const tags=new Set();for(const k in FOOD_RE)if(FOOD_RE[k].test(n))tags.add(k);
  if(tags.has('processedMeat'))tags.delete('redMeat');if(/\bturkey mince|chicken mince\b/.test(n)){tags.delete('redMeat');tags.add('poultry')}
  if(/\bpeanut butter\b/.test(n)){tags.add('nutsSeeds')}if(/\b(dark chocolate|protein bar|granola bar|popcorn)\b/.test(n))tags.add('snackLike');
  if(tags.has('fruit')&&/\b(juice|jam)\b/.test(n))tags.delete('fruit');if(/\bsweet potato\b/.test(n)){tags.delete('sweet')}
  return tags}
const isSweetOrProcessed=tags=>tags.has('sweet')||tags.has('processedSnack');
const isMeatTag=tags=>tags.has('redMeat')||tags.has('poultry')||tags.has('processedMeat');
const isPlantProtein=tags=>tags.has('legume')||tags.has('nutsSeeds');

/* ---- health profile & check-ins (stored in app/health, app/checkins) ---- */
const EMPTY_HEALTH=()=>({age:null,sex:'',heightCm:null,weightKg:null,activity:'',goals:[],preferences:'',considerations:[],considerationNote:'',limit:[],moreOften:[],dismissedSwaps:{},updatedAt:null});
function healthProfile(){S.health=S.health||EMPTY_HEALTH();if(!S.health.goals)S.health.goals=[];if(!S.health.dismissedSwaps)S.health.dismissedSwaps={};return S.health}
function hasHealthProfile(p){p=p||healthProfile();return !!(p.age||p.sex||p.heightCm||p.weightKg||p.activity||(p.goals||[]).length||p.preferences||(p.considerations||[]).length||(p.limit||[]).length||(p.moreOften||[]).length)}
function saveHealthProfile(patch){const p=healthProfile();Object.assign(p,patch,{updatedAt:Date.now()});return writeDoc('app/health',p)}
function deleteHealthProfile(){const keep=healthProfile().dismissedSwaps||{};S.health={...EMPTY_HEALTH(),dismissedSwaps:keep};return writeDoc('app/health',S.health)}
const wantsWeightLoss=p=>((p||healthProfile()).goals||[]).includes('lose');
const cholesterolConscious=p=>{p=p||healthProfile();return (p.considerations||[]).includes('cholesterol')||(p.goals||[]).includes('cholesterol')||(p.goals||[]).includes('heart')};
function checkins(){S.checkins=S.checkins||{days:{},dismissed:{}};if(!S.checkins.days)S.checkins.days={};if(!S.checkins.dismissed)S.checkins.dismissed={};return S.checkins}
function saveCheckin(date,answers){const c=checkins();c.days[date]={...(c.days[date]||{}),...answers,at:Date.now()};const keys=Object.keys(c.days).sort();if(keys.length>90)for(const k of keys.slice(0,keys.length-90))delete c.days[k];return writeDoc('app/checkins',c)}
function dismissCheckin(date){const c=checkins();c.dismissed[date]=true;const ks=Object.keys(c.dismissed).sort();if(ks.length>30)for(const k of ks.slice(0,ks.length-30))delete c.dismissed[k];return writeDoc('app/checkins',c)}

/* ---- planned pattern (from recipes in the week's slots; leftovers count as the same recipe) ---- */
function planFoodProfile(wk){wk=wk||week();const meals=[];for(const e of planEntries(wk)){let r=null;if(e.type==='recipe')r=e.recipe;else if(e.type==='leftovers')r=e.recipe;else if(e.type==='item')r=null;
    if(r){const tags=new Set();const names=[];for(const i of (r.ingredients||[])){const t=classifyFood(i.name);t.forEach(x=>tags.add(x));if(t.has('veg')||t.has('fruit'))names.push(canon(i.name))}meals.push({day:e.day,meal:e.meal,recipe:r,tags,names,leftovers:e.type==='leftovers',hasNutrition:!!(r.nutrition&&r.nutrition.kcal),estimated:!!r.nutritionEstimated})}
    else if(e.item){const t=classifyFood(e.item.name);meals.push({day:e.day,meal:e.meal,item:e.item,tags:t,names:t.has('veg')||t.has('fruit')?[canon(e.item.name)]:[],portion:true})}}
  const substantive=meals.filter(m=>!m.portion&&['breakfast','lunch','dinner'].includes(m.meal));
  const vegMeals=substantive.filter(m=>m.tags.has('veg'));const vegVariety=new Set();substantive.forEach(m=>m.names.filter(n=>FOOD_RE.veg.test(n)).forEach(n=>vegVariety.add(n)));
  const fruitPortions=meals.filter(m=>m.tags.has('fruit')).length;const fruitVariety=new Set();meals.forEach(m=>m.names.filter(n=>FOOD_RE.fruit.test(n)).forEach(n=>fruitVariety.add(n)));
  const fiber=new Set();meals.forEach(m=>{for(const i of ((m.recipe&&m.recipe.ingredients)||(m.item?[m.item]:[]))){const t=classifyFood(i.name);if(t.has('wholegrain')||t.has('legume')||t.has('nutsSeeds'))fiber.add(canon(i.name))}});
  const proteinMeals=substantive.filter(m=>PROTEIN_TYPES.some(t=>m.tags.has(t)));const proteinTypes={};PROTEIN_TYPES.forEach(t=>proteinTypes[t]=substantive.filter(m=>m.tags.has(t)).length);

/* ---- purchases: the grocery list to buy (planned purchases) and confirmed receipt lines for this week ---- */

function receiptLinesForWeek(wk,opts){opts=opts||{};const out=[];for(const t of ((wk||week()).trips||[]))for(const l of (t.lines||[])){if(l.status==='skip'||l.status==='duplicate')continue;const p=linePurpose(l);if(p==='pet'||p==='notme')continue;if(!opts.includeStockup&&p!=='week')continue;out.push({...l,purpose:p,tags:classifyFood(l.name)})}return out}
function purchaseFoodProfile(wk){wk=wk||week();const listLines=buildList(wk,S.ui.weekKey).filter(l=>!(l.atHome&&l.atHome.all)&&!l.staple&&!l.items.some(i=>i.kind==='pet'));
  const planned=listLines.map(l=>({name:l.name,tags:classifyFood(l.name),source:'list'}));const bought=receiptLinesForWeek(wk).map(l=>({name:l.name,tags:l.tags,source:'receipt'}));
  const count=(arr,fn)=>arr.filter(x=>fn(x.tags)).length;const names=(arr,fn)=>[...new Set(arr.filter(x=>fn(x.tags)).map(x=>canon(x.name)))];
  const prof=arr=>({fruit:count(arr,t=>t.has('fruit')),fruitNames:names(arr,t=>t.has('fruit')),veg:count(arr,t=>t.has('veg')),vegNames:names(arr,t=>t.has('veg')),fiber:names(arr,t=>t.has('wholegrain')||t.has('legume')||t.has('nutsSeeds')),sweets:count(arr,isSweetOrProcessed),sweetNames:names(arr,isSweetOrProcessed),meat:count(arr,isMeatTag),plantProtein:count(arr,t=>isPlantProtein(t)&&!isMeatTag(t)),fish:count(arr,t=>t.has('fish')),proteinTypes:PROTEIN_TYPES.filter(t=>arr.some(x=>x.tags.has(t))),total:arr.length});
  return {planned:prof(planned),bought:prof(bought),hasReceipts:bought.length>0}}

/* ---- receipt trends across weeks (confirmed lines only; at least 4 weeks with receipts) ---- */
function receiptTrends(currentKey){currentKey=currentKey||S.ui.weekKey;const cur=parseISO(currentKey);const rows=[];for(let i=1;i<=8;i++){const k=iso(addDays(cur,-7*i));const w=S.weeks[k];if(!w||!(w.trips||[]).some(t=>(t.lines||[]).length))continue;const lines=receiptLinesForWeek(w);const stock=receiptLinesForWeek(w,{includeStockup:true}).filter(l=>l.purpose!=='week');
    const tags=lines.map(l=>l.tags);rows.push({key:k,fruit:tags.some(t=>t.has('fruit')),veg:tags.filter(t=>t.has('veg')).length,sweets:tags.filter(isSweetOrProcessed).length,meat:tags.filter(isMeatTag).length,plant:tags.filter(t=>isPlantProtein(t)&&!isMeatTag(t)).length,fish:tags.filter(t=>t.has('fish')).length,stockup:stock.length,vegPlanned:planFoodProfile(w).vegMeals})}
  const n=rows.length;if(n<4)return {enough:false,weeks:n,lines:[]};const avg=k=>rows.reduce((a,r)=>a+r[k],0)/n;const older=rows.slice(Math.floor(n/2)),recent=rows.slice(0,Math.floor(n/2));const avgOf=(arr,k)=>arr.reduce((a,r)=>a+r[k],0)/(arr.length||1);
  const out=[];const fruitWeeks=rows.filter(r=>r.fruit).length;out.push(`You bought fruit in ${fruitWeeks} of the last ${n} weeks with receipts.`);
  const sw=avg('sweets');const swRecent=avgOf(recent,'sweets'),swOlder=avgOf(older,'sweets');if(swRecent>=swOlder+1.5)out.push(`Sweet or highly processed snack purchases rose from about ${Math.round(swOlder)} to ${Math.round(swRecent)} products a week.`);else if(swOlder>=swRecent+1.5)out.push(`Sweet or highly processed snack purchases eased from about ${Math.round(swOlder)} to ${Math.round(swRecent)} products a week.`);
  const meatAll=avg('meat'),plantAll=avg('plant'),fishAll=avg('fish');if(meatAll>plantAll+fishAll&&meatAll>0)out.push('Most of your protein purchases currently come from meat.');if(avgOf(recent,'plant')>avgOf(older,'plant')+0.5)out.push('Your recent purchases contain more plant-based proteins.');
  if(rows.filter(r=>r.veg>=2&&r.vegPlanned===0).length>=2)out.push('You regularly buy vegetables but sometimes do not assign them to meals.');
  return {enough:true,weeks:n,sweetAvg:sw,fruitWeeks,lines:out}}

function suggestAction(plan,buy,ind,p){const bits=[];if(plan.meals===0&&buy.planned.total===0&&!buy.hasReceipts)return '';const fruitTotal=plan.fruitPortions+buy.planned.fruit+buy.bought.fruit;if(fruitTotal<3)bits.push('add bananas or another fruit for a few days');if(plan.proteinMeals&&plan.meatMeals/plan.proteinMeals>0.6)bits.push('replace one meat meal with a chickpea or lentil recipe');else if(plan.meals&&plan.vegMeals<4)bits.push('add a vegetable side to one or two dinners');

function listHealthNotes(lines){const L=(lines||buildList()).filter(l=>!(l.atHome&&l.atHome.all)&&!l.staple&&!l.items.some(i=>i.kind==='pet'));if(!L.length)return [];const tags=L.map(l=>classifyFood(l.name));const notes=[];

/* ================= Local-first storage (IndexedDB) ================= */
/* One document-store interface, two backends: IdbBackend (browser) and MemoryBackend (tests, fallback).
   Every document key is "<profileId>/<path>" so profiles never share budgets, lists, receipts, pets or health data.
   The Claude artifact backend (claude.use("db")) is handled separately in boot() and is unchanged. */
const PLENTY_DB_NAME='plenty';
const PLENTY_DB_VERSION=2;           // IndexedDB object-store schema version
const PLENTY_DATA_VERSION=2;         // shape of the documents inside (migrated per profile)
const IDB_SCHEMA={                   // version -> upgrade step (runs inside onupgradeneeded, in order)
  1:db=>{const d=db.createObjectStore('docs',{keyPath:'key'});d.createIndex('profile','profile',{unique:false});d.createIndex('coll','pcoll',{unique:false});db.createObjectStore('meta',{keyPath:'key'})},
  2:db=>{const b=db.createObjectStore('blobs',{keyPath:'key'});b.createIndex('profile','profile',{unique:false})}};
/* document migrations: dataVersion -> fn(path, data) returning the new data (or null to delete) */
const DATA_MIGRATIONS={
  2:(path,data)=>{if(path==='app/settings'&&data&&!Array.isArray(data.pets)){const pets=[];if(data.petName)pets.push({id:'pet1',name:String(data.petName),type:'dog'});const d={...data,pets};delete d.petName;return d}return data}};
function migrateDoc(path,data,fromVersion){let d=data;for(let v=(fromVersion||1)+1;v<=PLENTY_DATA_VERSION;v++){if(DATA_MIGRATIONS[v])d=DATA_MIGRATIONS[v](path,d)}return d}
const collOf=path=>String(path).split('/')[0];

class MemoryBackend{constructor(){this.docs=new Map();this.blobs=new Map();this.meta=new Map();this.kind='memory'}
  async open(){return this}
  async getDoc(k){return this.docs.has(k)?clone(this.docs.get(k)):null}
  async putDoc(rec){this.docs.set(rec.key,clone(rec))}
  async delDoc(k){this.docs.delete(k)}
  async listDocs(prefix){const out=[];for(const [k,v] of this.docs)if(k.startsWith(prefix))out.push(clone(v));return out}
  async getMeta(k){return this.meta.has(k)?clone(this.meta.get(k)):null}
  async putMeta(k,v){this.meta.set(k,clone(v))}
  async putBlob(rec){this.blobs.set(rec.key,rec)}
  async getBlob(k){return this.blobs.get(k)||null}
  async delBlob(k){this.blobs.delete(k)}
  async listBlobs(prefix){const out=[];for(const [k,v] of this.blobs)if(k.startsWith(prefix))out.push({key:v.key,profile:v.profile,id:v.id,type:v.type,size:v.size,createdAt:v.createdAt});return out}
  async clearPrefix(prefix){for(const k of [...this.docs.keys()])if(k.startsWith(prefix))this.docs.delete(k);for(const k of [...this.blobs.keys()])if(k.startsWith(prefix))this.blobs.delete(k)}
  async count(prefix){let n=0;for(const k of this.docs.keys())if(k.startsWith(prefix))n++;return n}}

class IdbBackend{constructor(){this.db=null;this.kind='idb'}
  open(){return new Promise((res,rej)=>{if(typeof indexedDB==='undefined')return rej(new Error('IndexedDB unavailable'));const req=indexedDB.open(PLENTY_DB_NAME,PLENTY_DB_VERSION);
    req.onupgradeneeded=e=>{const db=req.result;for(let v=(e.oldVersion||0)+1;v<=PLENTY_DB_VERSION;v++)if(IDB_SCHEMA[v])IDB_SCHEMA[v](db)};
    req.onsuccess=()=>{this.db=req.result;this.db.onversionchange=()=>{this.db.close();this.db=null};res(this)};req.onerror=()=>rej(req.error||new Error('Could not open IndexedDB'));req.onblocked=()=>rej(new Error('IndexedDB blocked by another open tab'))})}
  tx(store,mode,fn){return new Promise((res,rej)=>{if(!this.db)return rej(new Error('Database closed'));const t=this.db.transaction(store,mode);const s=t.objectStore(store);let out;try{out=fn(s)}catch(e){return rej(e)}t.oncomplete=()=>res(out&&out.result!==undefined?out.result:out);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error||new Error('aborted'))})}
  req(store,mode,fn){return new Promise((res,rej)=>{if(!this.db)return rej(new Error('Database closed'));const t=this.db.transaction(store,mode);const r=fn(t.objectStore(store));r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
  range(prefix){return IDBKeyRange.bound(prefix,prefix+'￿')}
  async getDoc(k){const r=await this.req('docs','readonly',s=>s.get(k));return r||null}
  async putDoc(rec){await this.req('docs','readwrite',s=>s.put(rec))}
  async delDoc(k){await this.req('docs','readwrite',s=>s.delete(k))}
  async listDocs(prefix){return (await this.req('docs','readonly',s=>s.getAll(this.range(prefix))))||[]}
  async getMeta(k){const r=await this.req('meta','readonly',s=>s.get(k));return r?r.value:null}
  async putMeta(k,v){await this.req('meta','readwrite',s=>s.put({key:k,value:v}))}
  async putBlob(rec){await this.req('blobs','readwrite',s=>s.put(rec))}
  async getBlob(k){const r=await this.req('blobs','readonly',s=>s.get(k));return r||null}
  async delBlob(k){await this.req('blobs','readwrite',s=>s.delete(k))}
  async listBlobs(prefix){const all=(await this.req('blobs','readonly',s=>s.getAll(this.range(prefix))))||[];return all.map(v=>({key:v.key,profile:v.profile,id:v.id,type:v.type,size:v.size,createdAt:v.createdAt}))}
  async clearPrefix(prefix){await this.req('docs','readwrite',s=>s.delete(this.range(prefix)));await this.req('blobs','readwrite',s=>s.delete(this.range(prefix)))}
  async count(prefix){return (await this.req('docs','readonly',s=>s.count(this.range(prefix))))||0}}

const Store={backend:null,profileId:null,registry:{profiles:[],activeId:null},
  async init(backend){this.backend=backend;await backend.open();const reg=await backend.getMeta('profiles');this.registry=reg&&Array.isArray(reg.profiles)?reg:{profiles:[],activeId:null};this.profileId=this.registry.activeId&&this.registry.profiles.some(p=>p.id===this.registry.activeId)?this.registry.activeId:null;if(this.profileId)await this.migrateProfileData(this.profileId);return this},
  key(path,pid){return (pid||this.profileId)+'/'+path},
  async get(path,pid){const r=await this.backend.getDoc(this.key(path,pid));return r?r.data:null},
  async set(path,data,pid){const p=pid||this.profileId;if(!p)throw new Error('No active profile');await this.backend.putDoc({key:this.key(path,p),profile:p,pcoll:p+'/'+collOf(path),path,data:clone(data),updatedAt:Date.now()})},
  async del(path,pid){await this.backend.delDoc(this.key(path,pid))},
  async list(coll,pid){const p=pid||this.profileId;const rows=await this.backend.listDocs(p+'/'+coll+'/');const out={};for(const r of rows){const rest=r.path.slice(coll.length+1);if(!rest.includes('/'))out[rest]=r.data}return out},
  async allDocs(pid){const rows=await this.backend.listDocs((pid||this.profileId)+'/');const out={};for(const r of rows)out[r.path]=r.data;return out},
  /* blobs (receipt images) */
  async putBlob(id,blob,meta,pid){const p=pid||this.profileId;await this.backend.putBlob({key:p+'/'+id,profile:p,id,blob,type:blob&&blob.type||(meta&&meta.type)||'application/octet-stream',size:blob&&blob.size||0,createdAt:Date.now(),...(meta||{})})},
  async getBlob(id,pid){return this.backend.getBlob(this.key(id,pid))},
  async delBlob(id,pid){await this.backend.delBlob(this.key(id,pid))},
  async listBlobs(pid){return this.backend.listBlobs((pid||this.profileId)+'/')},
  /* profiles */
  async saveRegistry(){await this.backend.putMeta('profiles',this.registry)},
  async createProfile(name,opts){const id='p_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);this.registry.profiles.push({id,name:String(name||'Me').trim()||'Me',createdAt:Date.now(),dataVersion:PLENTY_DATA_VERSION});if(!opts||opts.activate!==false)this.registry.activeId=id;await this.saveRegistry();if(!opts||opts.activate!==false)this.profileId=id;return id},
  async switchProfile(id){if(!this.registry.profiles.some(p=>p.id===id))throw new Error('Unknown profile');this.registry.activeId=id;this.profileId=id;await this.saveRegistry();await this.migrateProfileData(id)},
  async renameProfile(id,name){const p=this.registry.profiles.find(x=>x.id===id);if(p){p.name=String(name).trim()||p.name;await this.saveRegistry()}},
  async deleteProfile(id){await this.backend.clearPrefix(id+'/');this.registry.profiles=this.registry.profiles.filter(p=>p.id!==id);if(this.registry.activeId===id){this.registry.activeId=null;this.profileId=null}await this.saveRegistry()},
  async clearProfile(id){await this.backend.clearPrefix((id||this.profileId)+'/')},
  async migrateProfileData(id){const p=this.registry.profiles.find(x=>x.id===id);if(!p)return;const from=p.dataVersion||1;if(from>=PLENTY_DATA_VERSION)return;const rows=await this.backend.listDocs(id+'/');for(const r of rows){const nd=migrateDoc(r.path,r.data,from);if(nd===null)await this.backend.delDoc(r.key);else if(nd!==r.data)await this.backend.putDoc({...r,data:nd,updatedAt:Date.now()})}p.dataVersion=PLENTY_DATA_VERSION;await this.saveRegistry()}};

/* UI-only preferences (small, non-sensitive) */
function uiPref(k){try{const o=JSON.parse(localStorage.getItem('plenty:ui')||'{}');return o[k]}catch(e){return undefined}}
function setUiPref(k,v){try{const o=JSON.parse(localStorage.getItem('plenty:ui')||'{}');o[k]=v;localStorage.setItem('plenty:ui',JSON.stringify(o))}catch(e){}}

/* Prototype data left by the earlier localStorage fallback (keys "plenty:<path>") */
function detectPrototypeLocalData(ls){const src=ls||(typeof localStorage!=='undefined'?localStorage:null);if(!src)return {count:0,docs:{}};const docs={};try{for(let i=0;i<src.length;i++){const k=src.key(i);if(!k||!k.startsWith('plenty:')||k==='plenty:ui'||k==='plenty:migrated')continue;try{docs[k.slice(7)]=JSON.parse(src.getItem(k))}catch(e){}}}catch(e){}
  const c=Object.keys(docs);return {count:c.length,docs,recipes:c.filter(p=>p.startsWith('recipes/')).length,weeks:c.filter(p=>p.startsWith('weeks/')).length,items:c.filter(p=>p.startsWith('items/')).length,hasHealth:c.includes('app/health'),hasReceipts:c.some(p=>p.startsWith('weeks/')&&docs[p]&&(docs[p].trips||[]).length),settingsName:docs['app/settings']&&docs['app/settings'].profileName||''}}
async function importPrototypeData(detected,profileId){let n=0;for(const path in detected.docs){const data=migrateDoc(path,detected.docs[path],1);if(data===null)continue;await Store.set(path,data,profileId);n++}return n}
function markPrototypeMigrated(){try{localStorage.setItem('plenty:migrated',new Date().toISOString())}catch(e){}}
function removePrototypeLocalData(){try{const ks=[];for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith('plenty:')&&k!=='plenty:ui')ks.push(k)}ks.forEach(k=>localStorage.removeItem(k))}catch(e){}}

const BACKUP_FORMAT='plenty-backup';
const BACKUP_VERSION=2;
const b64=u8=>{let s='';for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s)};
const unb64=s=>{const bin=atob(s);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u};
async function blobToBase64(blob){if(!blob)return '';if(typeof blob.arrayBuffer==='function')return b64(new Uint8Array(await blob.arrayBuffer()));return ''}
function containsSensitive(docs){return Object.keys(docs).some(p=>p==='app/health'||p==='app/checkins'||(p.startsWith('weeks/')&&docs[p]&&(docs[p].trips||[]).length))}
async function buildBackup(profileId){const pid=profileId||Store.profileId;const prof=Store.registry.profiles.find(p=>p.id===pid)||{name:'Me'};const docs=await Store.allDocs(pid);const blobs={};for(const m of await Store.listBlobs(pid)){const rec=await Store.getBlob(m.id,pid);if(rec&&rec.blob)blobs[m.id]={type:rec.type,data:await blobToBase64(rec.blob),tripId:rec.tripId||null}}
  return {format:BACKUP_FORMAT,version:BACKUP_VERSION,dataVersion:PLENTY_DATA_VERSION,exportedAt:new Date().toISOString(),app:'Plenty',profile:{name:prof.name},counts:backupCounts(docs,blobs),docs,blobs}}
function backupCounts(docs,blobs){const c=k=>Object.keys(docs).filter(p=>p.startsWith(k+'/')).length;return {recipes:c('recipes'),items:c('items'),inventory:c('inventory'),weeks:c('weeks'),prices:c('prices'),chats:c('chat'),receipts:Object.keys(docs).filter(p=>p.startsWith('weeks/')).reduce((a,p)=>a+((docs[p]||{}).trips||[]).length,0),images:Object.keys(blobs||{}).length,health:docs['app/health']?1:0,checkins:docs['app/checkins']?Object.keys(docs['app/checkins'].days||{}).length:0,settings:docs['app/settings']?1:0}}
/* encryption: AES-GCM with a PBKDF2-derived key */
const subtle=()=>(globalThis.crypto&&globalThis.crypto.subtle)||null;
async function deriveKey(password,salt,iterations){const enc=new TextEncoder();const km=await subtle().importKey('raw',enc.encode(password),'PBKDF2',false,['deriveKey']);return subtle().deriveKey({name:'PBKDF2',salt,iterations,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function encryptString(plain,password){const salt=crypto.getRandomValues(new Uint8Array(16));const iv=crypto.getRandomValues(new Uint8Array(12));const iterations=210000;const key=await deriveKey(password,salt,iterations);const ct=await subtle().encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(plain));return {format:BACKUP_FORMAT,version:BACKUP_VERSION,encrypted:true,kdf:'PBKDF2-SHA256',iterations,cipher:'AES-GCM',salt:b64(salt),iv:b64(iv),data:b64(new Uint8Array(ct))}}
async function decryptEnvelope(env,password){const key=await deriveKey(password,unb64(env.salt),env.iterations||210000);const pt=await subtle().decrypt({name:'AES-GCM',iv:unb64(env.iv)},key,unb64(env.data));return new TextDecoder().decode(pt)}
async function serializeBackup(backup,password){if(password){const env=await encryptString(JSON.stringify(backup),password);env.exportedAt=backup.exportedAt;env.profile={name:backup.profile.name};env.counts=backup.counts;return JSON.stringify(env)}return JSON.stringify(backup)}
async function parseBackup(text,password){let obj;try{obj=JSON.parse(String(text))}catch(e){return {ok:false,error:'This file is not a Plenty backup (not valid JSON).'}}
  if(!obj||obj.format!==BACKUP_FORMAT)return {ok:false,error:'This file is not a Plenty backup.'};
  if(obj.encrypted){if(!password)return {ok:false,needsPassword:true,summary:{name:obj.profile&&obj.profile.name,exportedAt:obj.exportedAt,counts:obj.counts},error:'This backup is encrypted. Enter its password.'};try{obj=JSON.parse(await decryptEnvelope(obj,password))}catch(e){return {ok:false,needsPassword:true,error:'Wrong password, or the file is damaged.'}}}
  return validateBackup(obj)}
function validateBackup(obj){const errors=[];if(!obj||obj.format!==BACKUP_FORMAT)errors.push('Not a Plenty backup.');if(typeof obj.version!=='number'||obj.version<1)errors.push('Missing backup version.');if(obj.version>BACKUP_VERSION)errors.push(`This backup was made by a newer Plenty (version ${obj.version}). Update the app first.`);if(!obj.docs||typeof obj.docs!=='object'||Array.isArray(obj.docs))errors.push('The backup has no documents.');
  if(!errors.length){for(const p in obj.docs){if(!/^[A-Za-z0-9_\-.~:@+]+(\/[A-Za-z0-9_\-.~:@+]+)+$/.test(p)){errors.push('Damaged document path: '+p.slice(0,40));break}if(obj.docs[p]!==null&&(typeof obj.docs[p]!=='object'||Array.isArray(obj.docs[p]))){errors.push('Damaged document: '+p.slice(0,40));break}}}
  if(errors.length)return {ok:false,error:errors.join(' ')};
  const docs={};const from=obj.dataVersion||obj.version||1;for(const p in obj.docs){const d=migrateDoc(p,obj.docs[p],from);if(d!==null)docs[p]=d}
  return {ok:true,backup:{...obj,docs,blobs:obj.blobs||{}},summary:{name:(obj.profile&&obj.profile.name)||'Unknown',exportedAt:obj.exportedAt||'',counts:backupCounts(docs,obj.blobs||{}),migrated:from<PLENTY_DATA_VERSION}}}
async function applyBackup(profileId,backup,mode){const pid=profileId;if(mode==='replace')await Store.clearProfile(pid);for(const p in backup.docs)await Store.set(p,backup.docs[p],pid);
  for(const id in backup.blobs||{}){const b=backup.blobs[id];if(!b||!b.data)continue;const bytes=unb64(b.data);const blob=typeof Blob!=='undefined'?new Blob([bytes],{type:b.type||'image/jpeg'}):{size:bytes.length,type:b.type,arrayBuffer:async()=>bytes.buffer};await Store.putBlob(id,blob,{tripId:b.tripId||null,type:b.type},pid)}
  return verifyImport(pid,backup)}
async function verifyImport(profileId,backup){const docs=await Store.allDocs(profileId);const missing=Object.keys(backup.docs).filter(p=>!(p in docs));const blobs=await Store.listBlobs(profileId);const missingBlobs=Object.keys(backup.blobs||{}).filter(id=>!blobs.some(b=>b.id===id));return {ok:!missing.length&&!missingBlobs.length,docs:Object.keys(docs).length,expectedDocs:Object.keys(backup.docs).length,blobs:blobs.length,missing,missingBlobs}}
function downloadText(filename,text,type){if(typeof document==='undefined')return false;try{const blob=new Blob([text],{type:type||'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},2000);return true}catch(e){return false}}
const backupFilename=name=>`plenty-backup-${String(name||'profile').toLowerCase().replace(/[^a-z0-9]+/g,'-')}-${iso(today())}.json`;

function openImport(){if(db){toast('Import is available in the standalone Plenty.');return}let parsed=null,fileText='';
  openModal(`${mhead('Import a backup','Nothing changes until you confirm. Existing information is only replaced if you choose that.')}<div class="mb">

  const fi=document.getElementById('biFile');fi.onchange=()=>{const f=fi.files[0];document.getElementById('biCheck').disabled=!f;if(f)f.text().then(t=>{fileText=t})};
  document.getElementById('biCheck').onclick=async()=>{const out=document.getElementById('biOut');const pw=document.getElementById('biPass').value;const res=await parseBackup(fileText,pw||null);

    parsed=res;const s=res.summary,c=s.counts;const cur=await Store.allDocs();const hasCurrent=Object.keys(cur).length>0;
    out.innerHTML=`<div class="card pad"><div class="kv"><span>Profile in backup</span><b>${esc(s.name)}</b></div><div class="kv"><span>Exported</span><b>${esc(s.exportedAt?s.exportedAt.slice(0,16).replace('T',' '):'unknown')}</b></div><div class="kv"><span>Will import</span><b class="num">${c.recipes} recipes, ${c.items} items, ${c.inventory} inventory, ${c.weeks} weeks (${c.receipts} receipts, ${c.images} images), ${c.health?'a health profile':'no health profile'}, ${c.checkins} check-ins</b></div>${s.migrated?'<div class="small muted">The backup is from an older Plenty and will be migrated to the current format.</div>':''}</div>
      ${hasCurrent?`<div class="note warn" style="margin-top:10px"><b>This profile already has information.</b> Choose whether the backup replaces it or is added to it. Replacing removes everything currently in this profile first.</div><div class="checks" style="margin-top:8px"><label><input type="radio" name="biMode" value="merge" checked> Add to current data (documents with the same id are overwritten)</label><label><input type="radio" name="biMode" value="replace"> Replace current data</label><label><input type="radio" name="biMode" value="new"> Import into a new profile named “${esc(s.name)}”</label></div>`:'<div class="small muted" style="margin-top:8px">This profile is empty, so the backup is imported as it is.</div>'}
      <div class="actions" style="margin-top:12px"><button class="btn primary" id="biGo">Import now</button></div>`;
    document.getElementById('biGo').onclick=async()=>{const modeEl=document.querySelector('input[name="biMode"]:checked');const mode=modeEl?modeEl.value:'merge';const go=async()=>{let pid=Store.profileId;if(mode==='new'){pid=await Store.createProfile(s.name,{activate:false})}const v=await applyBackup(pid,parsed.backup,mode==='replace'?'replace':'merge');if(mode==='new')await Store.switchProfile(pid);await loadProfileState();S.ui.mode='app';closeModal();renderNav();render();toast(v.ok?`Backup imported: ${v.docs} documents, ${v.blobs} images verified.`:`Imported with ${v.missing.length+v.missingBlobs.length} problem(s). Check your data.`)};
      if(mode==='replace')confirmModal('Replace everything in this profile?','All current plans, recipes, receipts, pets and health data in this profile are removed and replaced by the backup. Export a backup first if you are unsure.','Replace and import',go,true);else go()}}}

/* ================= PWA: service worker, updates, install ================= */
const IS_ARTIFACT=!!(window.claude&&typeof window.claude.use==='function');
let swReg=null,installPrompt=null;
function registerPWA(){if(IS_ARTIFACT||!('serviceWorker' in navigator)||!/^https?:$/.test(location.protocol))return;
  navigator.serviceWorker.register('./sw.js',{scope:'./'}).then(reg=>{swReg=reg;if(reg.waiting)S.ui.updateReady=true;reg.addEventListener('updatefound',()=>{const nw=reg.installing;if(!nw)return;nw.addEventListener('statechange',()=>{if(nw.state==='installed'&&navigator.serviceWorker.controller){S.ui.updateReady=true;render()}})});render()}).catch(e=>console.warn('sw',e));
  let reloading=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(reloading)return;reloading=true;location.reload()})}
function applyUpdate(){if(swReg&&swReg.waiting){swReg.waiting.postMessage({type:'SKIP_WAITING'})}else location.reload()}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;S.ui.canInstall=true;render()});
window.addEventListener('appinstalled',()=>{installPrompt=null;S.ui.canInstall=false;setUiPref('installed',true);render()});
async function promptInstall(){if(installPrompt){installPrompt.prompt();const r=await installPrompt.userChoice.catch(()=>null);installPrompt=null;S.ui.canInstall=false;render();return r}return null}
const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent)&&!window.MSStream;
const isStandalone=()=>window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;

/* ================= Accounts (Netlify Identity + Functions) =================
   Local data stays authoritative. The account is a private copy the user fills and reads on purpose.
   Active only when the page was built with PLENTY_CLOUD=netlify (a <meta name="plenty-cloud"> tag is present). */
const CLOUD=(()=>{const m=document.querySelector('meta[name="plenty-cloud"]');return m?m.content:''})();
S.cloud={user:null,ready:false,profile:null,busy:false,unavailable:''};
const cloudOn=()=>CLOUD==='netlify'&&!IS_ARTIFACT;
function initAccount(){if(!cloudOn())return;const w=window.netlifyIdentity;if(!w){S.cloud.unavailable='The sign-in service did not load. Check your connection and reload.';return}
  w.on('init',u=>{S.cloud.user=u||null;S.cloud.ready=true;render();if(u)loadCloudProfile()});
  w.on('login',u=>{S.cloud.user=u;w.close();render();loadCloudProfile();toast(`Signed in as ${u.email}`)});
  w.on('logout',()=>{S.cloud.user=null;S.cloud.profile=null;render();toast('Signed out')});
  w.on('error',e=>{console.warn('identity',e&&e.message);S.cloud.unavailable=''});
  w.init({APIUrl:location.origin+'/.netlify/identity'})}
if(cloudOn()){if(window.netlifyIdentity)initAccount();else window.addEventListener('load',initAccount)}
async function cloudToken(){const u=S.cloud.user;if(!u)throw {code:'unauthenticated'};return u.jwt()}
async function api(path,opts){opts=opts||{};const token=await cloudToken();const res=await fetch('/api/'+path,{method:opts.method||'GET',headers:{Authorization:'Bearer '+token,...(opts.body?{'Content-Type':'application/json'}:{})},body:opts.body?JSON.stringify(opts.body):undefined});
  if(opts.raw)return res;let j=null;try{j=await res.json()}catch(e){}if(!res.ok){const err=(j&&j.error)||{code:'http_'+res.status,message:'The account service answered '+res.status+'.'};err.status=res.status;err.details=(j&&j.error&&j.error.details)||null;throw err}return j}
async function loadCloudProfile(){try{S.cloud.profile=await api('profile');S.cloud.unavailable=''}catch(e){S.cloud.profile=null;S.cloud.unavailable=e.code==='database_not_configured'?'The account database is not enabled on this deployment yet. Sign-in works, but nothing can be stored until the site owner enables Netlify Database.':(e.message||'Could not reach the account service.')}render()}
const cloudErr=e=>e&&e.code==='unauthenticated'?'Sign in first.':(e&&e.message)||'The account service could not be reached.';

/* ================= At Home recipe matching =================
   Deterministic and local: a match is based only on the recipe ingredients and
   the inventory saved on this device. No AI or invented substitutions. */
function atHomeRecipeMatch(recipe,ctx){
  ctx=ctx||discoverContext();
  const seen=new Set(),have=[],missing=[];
  for(const ing of (recipe.ingredients||[])){
    const c=canon(ing.name);if(!c||seen.has(c))continue;seen.add(c);
    if(ctx.inv[c])have.push({canon:c,name:ing.name});else missing.push({canon:c,name:ing.name});
  }
  const total=have.length+missing.length;
  return {recipe,have,missing,total,ratio:total?have.length/total:0};
}
function atHomeRecipeMatches(recipes,maxMissing){
  const ctx=discoverContext();
  return filterRecipes(recipes||allDiscoverRecipes(),{},ctx).results
    .map(r=>atHomeRecipeMatch(r,ctx))
    .filter(m=>m.total&&m.have.length&&m.missing.length<=maxMissing)
    .sort((a,b)=>a.missing.length-b.missing.length||b.ratio-a.ratio||a.recipe.name.localeCompare(b.recipe.name));
}

  {id:'aldi-us',countryCode:'US',name:'Aldi',logoUrl:null,scope:'US',sourceCapabilities:[]},
  {id:'walmart',countryCode:'US',name:'Walmart',logoUrl:null,scope:'US',sourceCapabilities:[]},
  {id:'no-frills',countryCode:'CA',name:'No Frills',logoUrl:null,scope:'CA',sourceCapabilities:[]},

  {id:'save-on-foods',countryCode:'CA',name:'Save-On-Foods',logoUrl:null,scope:'CA',sourceCapabilities:[]}];

const PRICE_FRESH_DAYS=7;          // a retailer price older than this is no longer "current"
const RECEIPT_FRESH_DAYS=60;       // a receipt price older than this becomes an estimate

const DEFAULT_MIN_SAVING={ '€':3, '$':3, '£':3, 'kr':30, 'CHF':3, 'R':40, 'A$':4, 'C$':4, '¥':400, '₹':200 };

const countryCode=()=>{const s=S.settings;return s.countryCode||COUNTRY_CODES[s.country]||(s.currency==='€'?'NL':s.currency==='C$'?'CA':s.currency==='$'?'US':'')};

const storeById=id=>STORE_REGISTRY.find(s=>s.id===id)||(S.stores&&S.stores[id])||null;

/* ---- normalization: price per kg / L / unit ---- */
function normalizeQuantity(qty,unit){const f=famOf(unit);return {base:(+qty||0)*f.factor,fam:f.key}}
function unitPriceOf(price,qty,unit){const n=normalizeQuantity(qty,unit);if(!(n.base>0)||!(price>=0))return null;return {unitPrice:price/n.base,fam:n.fam}}
function fmtUnitPrice(unitPrice,famKey){if(unitPrice==null)return '';if(famKey==='mass')return money(unitPrice*1000)+'/kg';if(famKey==='vol')return money(unitPrice*1000)+'/L';if(famKey==='spoon')return money(unitPrice*15)+'/tbsp';return money(unitPrice)+'/'+(famKey.startsWith('count:')?famKey.slice(6).replace('pcs','unit'):'unit')}

/* ---- models (documents) ---- */
function makeProduct(p){const n=normalizeQuantity(p.packageQuantity,p.packageUnit);return {id:p.id||uid('prod'),canonicalName:String(p.canonicalName||p.name||'').trim(),canon:canon(p.canonicalName||p.name||''),brand:p.brand||'',category:CATS.includes(p.category)?p.category:guessCat(p.canonicalName||p.name||''),packageQuantity:+p.packageQuantity||0,packageUnit:p.packageUnit||'',normalizedQuantity:n.base,fam:n.fam,imageUrl:p.imageUrl||null,imageSource:p.imageSource||'',identifiers:{ean:(p.identifiers&&p.identifiers.ean)||p.ean||'',upc:(p.identifiers&&p.identifiers.upc)||p.upc||''},favorite:!!p.favorite,createdAt:p.createdAt||Date.now()}}

function makeObservation(o,product){const up=product?unitPriceOf(+o.price,product.packageQuantity,product.packageUnit):null;return {id:o.id||uid('po'),storeProductId:o.storeProductId,price:Math.round((+o.price||0)*100)/100,currency:o.currency||S.settings.currency||'€',normalizedUnitPrice:o.normalizedUnitPrice!=null?+o.normalizedUnitPrice:(up?up.unitPrice:null),priceType:PRICE_TYPES.includes(o.priceType)?o.priceType:'regular',observedAt:o.observedAt||new Date().toISOString(),validFrom:o.validFrom||null,validUntil:o.validUntil||null,sourceName:o.sourceName||'',sourceUrl:o.sourceUrl||'',confidence:o.confidence==null?0.9:Math.max(0,Math.min(1,+o.confidence)),userConfirmed:!!o.userConfirmed,locationScope:o.locationScope||'',manual:!!o.manual}}
function makeOffer(f){return {id:f.id||uid('of'),storeProductId:f.storeProductId,description:f.description||'',originalPrice:+f.originalPrice||null,offerPrice:+f.offerPrice||null,mechanic:f.mechanic||'',validFrom:f.validFrom||null,validUntil:f.validUntil||null,loyaltyRequired:!!f.loyaltyRequired,sourceUrl:f.sourceUrl||''}}
function offerActive(o,onDate){const d=onDate||iso(today());if(o.validFrom&&d<o.validFrom)return false;if(o.validUntil&&d>o.validUntil)return false;return true}
const daysAgo=ts=>{if(!ts)return Infinity;const d=new Date(ts);return isNaN(d)?Infinity:Math.floor((today()-new Date(d.getFullYear(),d.getMonth(),d.getDate()))/86400000)}
/* effective status of an observation today: which label it may carry and whether it can be used as a current price */
function observationStatus(ob){const age=daysAgo(ob.observedAt);if(ob.priceType==='promotion'){if(!offerActive({validFrom:ob.validFrom,validUntil:ob.validUntil}))return {usable:false,label:'Expired promotion',type:'expired'};return {usable:true,label:PRICE_LABEL.promotion,type:'promotion',current:true}}

  if(ob.manual)return {usable:true,label:PRICE_LABEL.manual+(age>PRICE_FRESH_DAYS?' (older)':''),type:age>PRICE_FRESH_DAYS?'predicted':'manual',current:age<=PRICE_FRESH_DAYS};
  return age<=PRICE_FRESH_DAYS?{usable:true,label:PRICE_LABEL.regular,type:'regular',current:true}:{usable:true,label:PRICE_LABEL.predicted,type:'predicted',current:false}}

/* ---- matching seams (deterministic) ---- */
function matchScore(line,product,storeProduct){let score=0,reasons=[];if(line.ean&&product.identifiers&&product.identifiers.ean&&line.ean===product.identifiers.ean){score=1;reasons.push('barcode')}
  else if(line.retailerProductId&&storeProduct&&storeProduct.retailerProductId&&line.retailerProductId===storeProduct.retailerProductId){score=0.95;reasons.push('retailer id')}
  else{const lc=line.canon||canon(line.name);if(lc&&product.canon===lc){score=0.85;reasons.push('name')}else if(lc&&(product.canon.includes(lc)||lc.includes(product.canon))&&Math.min(lc.length,product.canon.length)>=4){score=0.55;reasons.push('partial name')}else return {score:0,reasons:[]};
    if(line.fam&&product.fam){if(line.fam.key===product.fam)score+=0.1;else score-=0.3}
    if(line.category&&product.category===line.category)score+=0.05}

const matchStatus=score=>score>=MATCH_AUTO?'matched':score>=MATCH_REVIEW?'review':'none';

/* ---- candidate prices for a grocery line at a store ---- */
function latestObservations(storeProductId){return Object.values(S.priceobs||{}).filter(o=>o.storeProductId===storeProductId).sort((a,b)=>String(b.observedAt).localeCompare(String(a.observedAt)))}
function receiptCandidate(line,store){const p=S.prices&&S.prices[line.canon];if(!p||p.fam!==line.fam.key)return null;const samples=(p.samples||[]).filter(s=>s.store&&store&&(s.store.toLowerCase()===store.name.toLowerCase()||s.store.toLowerCase().includes(store.name.toLowerCase().split(' ')[0])));if(!samples.length)return null;
  const up=robustUnitPrice(samples);const last=samples[samples.length-1];const age=daysAgo(last.date);const type=age<=RECEIPT_FRESH_DAYS?'receipt_confirmed':'predicted';return {storeId:store.id,cost:up*line.needBase,unitPrice:up,type,label:PRICE_LABEL[type],observedAt:last.date,confidence:samples.length>=3?0.8:0.6,source:'Your receipt',matchStatus:'matched',productName:line.name,packs:null}}

    const obs=latestObservations(sp.id).map(o=>({o,s:observationStatus(o)})).filter(x=>x.s.usable);if(!obs.length)continue;const promo=obs.find(x=>x.s.type==='promotion');const pick=promo||obs[0];const o=pick.o;
    let cost,packs=null;if(prod.normalizedQuantity>0&&prod.fam===line.fam.key){packs=Math.max(1,Math.ceil(line.needBase/prod.normalizedQuantity-1e-9));cost=packs*o.price}else if(o.normalizedUnitPrice!=null&&prod.fam===line.fam.key){cost=o.normalizedUnitPrice*line.needBase}else continue;
    out.push({storeId:store.id,cost,unitPrice:o.normalizedUnitPrice,type:pick.s.type,label:pick.s.label,current:!!pick.s.current,observedAt:o.observedAt,validUntil:o.validUntil,confidence:Math.min(o.confidence,m.score),source:o.sourceName||(o.manual?'Entered by you':'Retailer'),sourceUrl:o.sourceUrl,matchStatus:st,matchScore:m.score,reasons:m.reasons,productName:prod.canonicalName+(prod.packageQuantity?` ${prod.packageQuantity} ${prod.packageUnit}`:''),productId:prod.id,storeProductId:sp.id,packs,price:o.price})}

  out.sort((a,b)=>(a.matchStatus==='matched'?0:1)-(b.matchStatus==='matched'?0:1)||a.cost-b.cost);return out}
function bestCandidate(line,store){const c=storeCandidates(line,store).filter(x=>x.matchStatus==='matched');return c[0]||null}

/* ---- basket comparison ---- */
function comparableLines(lines){return (lines||buildList()).filter(l=>!(l.atHome&&l.atHome.all)&&l.needBase>0)}

  const used=Object.keys(alloc).sort((a,b)=>alloc[b].length-alloc[a].length||((storeById(a)||{}).name||a).localeCompare((storeById(b)||{}).name||b));return {storeIds:used,total:Math.round(total*100)/100,matched,unmatched:unmatched.length,unmatchedLines:unmatched,alloc,types,lastChecked,complete:unmatched.length===0,coveredKeys:lines.filter(l=>storeIds.some(sid=>matrix[l.key][sid])).map(l=>l.key).sort().join('|')}}
function compareBaskets(opts){opts=opts||{};const stores=opts.stores||preferredStores();const lines=comparableLines(opts.lines);const minSave=opts.minSaving!=null?+opts.minSaving:minSaving();const matrix=priceMatrix(lines,stores);

  const singles=stores.map(st=>optionFor([st.id],lines,matrix)).map((o,i)=>({...o,storeIds:[stores[i].id]})).sort((a,b)=>b.matched-a.matched||a.total-b.total);

  return {stores,lines,matrix,minSaving:minSave,mode,options:{easiest:withSavings(easiest),recommended:withSavings(recommended),cheapest:withSavings(cheapest)},singles:singles.map(withSavings),recNote,totalLines:lines.length}}
function allocationText(option){const parts=option.storeIds.map(sid=>{const st=storeById(sid);const n=(option.alloc[sid]||[]).length;return `${n} item${n===1?'':'s'} at ${st?st.name:sid}`});return option.storeIds.length>1?parts.slice(0,-1).join(', ')+' and '+parts[parts.length-1]:parts.join('')}
function coverageText(option,total){return option.unmatched?`Estimated total for ${option.matched} of ${total} items — ${option.unmatched} price${option.unmatched===1?'':'s'} unavailable`:`Estimated total for all ${total} items`}
function typesText(types){const parts=[];if(types.regular)parts.push(`${types.regular} current online`);if(types.promotion)parts.push(`${types.promotion} promotion`);if(types.receipt_confirmed)parts.push(`${types.receipt_confirmed} receipt-confirmed`);if(types.manual)parts.push(`${types.manual} entered by you`);if(types.predicted)parts.push(`${types.predicted} estimated`);return parts.join(', ')}

/* ---- product search over known products ---- */
function productPrices(product){const out=[];for(const sp of Object.values(S.storeproducts||{})){if(sp.productId!==product.id)continue;const st=storeById(sp.storeId);if(!st)continue;const obs=latestObservations(sp.id).map(o=>({o,s:observationStatus(o)}));const usable=obs.filter(x=>x.s.usable);const promo=usable.find(x=>x.s.type==='promotion');const regular=usable.find(x=>x.s.type!=='promotion');const offers=Object.values(S.offers||{}).filter(f=>f.storeProductId===sp.id&&offerActive(f));
    out.push({store:st,storeProduct:sp,regular:regular?{...regular.o,status:regular.s}:null,promotion:promo?{...promo.o,status:promo.s}:null,offers,unavailable:!usable.length})}
  return out.sort((a,b)=>a.store.name.localeCompare(b.store.name))}
function searchProducts(q,f){f=f||{};const ql=String(q||'').trim().toLowerCase();const cc=countryCode();const pref=new Set((f.storeIds&&f.storeIds.length?f.storeIds:preferredStores().map(s=>s.id)));
  let list=Object.values(S.products||{}).filter(p=>!ql||p.canonicalName.toLowerCase().includes(ql)||p.canon.includes(canon(ql))||(p.brand||'').toLowerCase().includes(ql));if(f.category)list=list.filter(p=>p.category===f.category);
  const rows=list.map(p=>{const prices=productPrices(p).filter(x=>x.store.countryCode===cc&&pref.has(x.store.id));const best=prices.filter(x=>!x.unavailable).map(x=>(x.promotion||x.regular)).sort((a,b)=>a.price-b.price)[0]||null;return {product:p,prices,best,bestUnit:best?best.normalizedUnitPrice:null}});
  const sort=f.sort||'price';rows.sort((a,b)=>{if(sort==='unit')return (a.bestUnit==null)-(b.bestUnit==null)||(a.bestUnit||0)-(b.bestUnit||0);if(sort==='name')return a.product.canonicalName.localeCompare(b.product.canonicalName);return (a.best==null)-(b.best==null)||((a.best?a.best.price:0)-(b.best?b.best.price:0))});return rows}

/* apply normalized provider records into the local documents (used by manual entry now, remote later) */
async function ingestProviderRecords(rec){const written=[];for(const p of (rec.products||[])){const prod=makeProduct(p);S.products[prod.id]=prod;await writeDoc('products/'+prod.id,prod);written.push(prod.id)}for(const sp of (rec.storeProducts||[])){const s=makeStoreProduct(sp);S.storeproducts[s.id]=s;await writeDoc('storeproducts/'+s.id,s)}for(const o of (rec.observations||[])){const sp=S.storeproducts[o.storeProductId];const prod=sp?S.products[sp.productId]:null;const ob=makeObservation(o,prod);S.priceobs[ob.id]=ob;await writeDoc('priceobs/'+ob.id,ob)}for(const f of (rec.offers||[])){const of=makeOffer(f);S.offers[of.id]=of;await writeDoc('offers/'+of.id,of)}return written}
/* manual observation: the user saw a price in a store */
async function recordManualPrice(input){const cc=countryCode();const store=storeById(input.storeId);if(!store)throw new Error('Choose a store');let prod=Object.values(S.products).find(p=>p.canon===canon(input.name)&&Math.abs(p.normalizedQuantity-normalizeQuantity(input.packageQuantity,input.packageUnit).base)<1e-9);
  if(!prod)prod=makeProduct({canonicalName:input.name,brand:input.brand,category:input.category,packageQuantity:input.packageQuantity,packageUnit:input.packageUnit,ean:input.ean});
  let sp=Object.values(S.storeproducts).find(s=>s.productId===prod.id&&s.storeId===store.id);if(!sp)sp=makeStoreProduct({storeId:store.id,productId:prod.id,retailerName:input.retailerName||prod.canonicalName,retailerProductId:input.retailerProductId||''});
  const ob=makeObservation({storeProductId:sp.id,price:input.price,priceType:input.promotion?'promotion':'regular',validFrom:input.promotion?iso(today()):null,validUntil:input.promotion?(input.validUntil||null):null,sourceName:'Entered by you',confidence:0.9,userConfirmed:true,manual:true,locationScope:cc,currency:S.settings.currency},prod);
  await ingestProviderRecords({products:[prod],storeProducts:[sp],observations:[ob]});return {product:prod,storeProduct:sp,observation:ob}}

    <label class="checks" style="display:flex"><input type="checkbox" id="mpPromo"> This is a promotion</label><div class="field" id="mpUntilWrap" hidden><label for="mpUntil">Promotion valid until</label><input id="mpUntil" type="date"></div><div id="mpOut"></div></div>
    <div class="mf"><button class="btn ghost" data-close>Cancel</button><div class="actions"><button class="btn primary" id="mpGo" ${stores.length?'':'disabled'}>Save price</button></div></div>`);
  const $=id=>document.getElementById(id);$('mpPromo').onchange=()=>{$('mpUntilWrap').hidden=!$('mpPromo').checked};
  $('mpGo').onclick=async()=>{const price=parseFloat($('mpPrice').value);const name=$('mpName').value.trim();const qty=parseFloat($('mpQty').value);if(!name||isNaN(price)||price<0){$('mpOut').innerHTML='<div class="note bad">A product name and a price are needed.</div>';return}if(!(qty>0)){$('mpOut').innerHTML='<div class="note bad">Enter the package size so the price per kg, L or unit can be compared.</div>';return}
    try{await recordManualPrice({storeId:$('mpStore').value,name,brand:$('mpBrand').value.trim(),packageQuantity:qty,packageUnit:$('mpUnit').value,category:$('mpCat').value,ean:$('mpEan').value.trim(),price,promotion:$('mpPromo').checked,validUntil:$('mpUntil').value||null});closeModal();render();toast('Price saved as entered by you')}catch(e){$('mpOut').innerHTML=`<div class="note bad">${esc(e.message||'Could not save.')}</div>`}}}
function openHowPrices(){openModal(`${mhead('How price comparison works')}<div class="mb">
  <p>Plenty compares the items on your list across the supermarkets you chose in Settings. Every price carries its <b>source</b>, <b>date</b>, <b>type</b>, <b>confidence</b> and <b>store scope</b>, and the label tells you what kind of price it is:</p>
  <ul class="hl"><li>${typeBadge('regular')} a retailer price observed within the last ${PRICE_FRESH_DAYS} days from an authorized source.</li><li>${typeBadge('promotion')} a time-limited offer; expired promotions are never used in totals.</li><li>${typeBadge('receipt_confirmed')} what you actually paid, from a receipt you confirmed in the last ${RECEIPT_FRESH_DAYS} days.</li><li>${typeBadge('manual','Entered by you')} a price you typed in after seeing it in a store.</li><li>${typeBadge('predicted')} an older observation used as an estimate; it is never presented as a current price.</li><li>${typeBadge('unavailable')} no real observation exists, so nothing is shown. Plenty never invents a price.</li></ul>
  <p style="margin-top:10px"><b>Matching.</b> Products are matched to your list by barcode first, then retailer product id, then canonical name with quantity, unit, category and brand. Matches below the confidence threshold are marked “Review match” and left out of totals.</p>
  <p style="margin-top:10px"><b>Options.</b> <i>Easiest</i> buys every matched item at one store. <i>Recommended</i> respects your store-count setting and only adds a store when it saves at least your minimum. <i>Cheapest</i> is the lowest known total. A basket is never called complete while any price is unavailable.</p>
  <p class="small muted" style="margin-top:10px">Right now prices come from your receipts and from prices you enter. Live retailer prices will arrive through authorized sources behind Plenty's server functions; until then no store is contacted and nothing is scraped.</p></div><div class="mf"><span></span><div class="actions"><button class="btn" data-close>Close</button></div></div>`)}

/* ---- Settings card: country, preferred stores, comparison rules ---- */
function storesSettingsCardHtml(){const cc=countryCode();const stores=storesForCountry(cc);const pref=S.settings.preferredStores||[];
  return `<div class="card pad"><h3 style="margin-bottom:8px">Supermarkets & price comparison</h3>
    <div class="field"><label for="sCC">Market</label><select id="sCC" data-setting="countryCode">${[['','Choose'],['NL','Netherlands'],['US','United States'],['CA','Canada'],['BE','Belgium'],['DE','Germany'],['GB','United Kingdom']].map(([v,l])=>`<option value="${v}" ${cc===v?'selected':''}>${l}</option>`).join('')}</select></div>
    <div class="field" style="margin-top:10px"><label>Preferred supermarkets <span class="faint" style="font-weight:400">only stores in your market are shown</span></label><div class="checks">${stores.length?stores.map(st=>`<label><input type="checkbox" data-pref-store="${st.id}" ${pref.includes(st.id)?'checked':''}>${esc(st.name)}</label>`).join(''):'<span class="small muted">No supermarket list for this market yet.</span>'}</div></div>
    <div class="row" style="margin-top:10px"><div class="field"><label for="sMode">Default store count for comparison</label><select id="sMode" data-setting="compareMode"><option value="one" ${compareMode()==='one'?'selected':''}>One store only</option><option value="two" ${compareMode()==='two'?'selected':''}>Maximum two stores</option><option value="any" ${compareMode()==='any'?'selected':''}>Lowest price regardless</option></select></div><div class="field"><label for="sMin">Minimum saving to visit another store (${esc(S.settings.currency||'')})</label><input id="sMin" type="number" min="0" step="0.5" value="${minSaving()}" data-setting="minStoreSaving"></div></div>
    <p class="small muted" style="margin-top:8px">Prices are never invented: they come from your confirmed receipts, prices you enter, and later from authorized retailer sources. ${RETAILER_ADAPTERS.filter(a=>a.countryCode===cc).length?`Retailer connections for ${esc(cc)} are planned, not live.`:''}</p></div>`}
function basketBudgetLineHtml(){const c=week().basketChoice;if(!c)return '';return `<div class="kv"><span>Selected basket estimate<span class="sub">${esc(c.optionKey)} option · ${c.matched} of ${c.totalLines} items priced · ${esc(fmtWhen(c.at))}</span></span><b class="num">${money(c.total)}</b></div>`}

/* ================= start ================= */
// Runs last so every part (including const bindings) is initialised before the first render.
boot();

</script>
