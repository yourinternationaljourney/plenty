<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBF7EF">
<script>try{var t=JSON.parse(localStorage.getItem('plenty:ui')||'{}').theme;document.documentElement.setAttribute('data-theme',t==='dark'||t==='system'?t:'light')}catch(e){document.documentElement.setAttribute('data-theme','light')}</script>
<meta name="description" content="Plenty: weekly grocery, food, household and budget planner that lives on your device.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Plenty">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">

<title>Plenty</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Karla:wght@400;500;600;700&display=swap">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
</head>
<body>
<style>
/* Mediterranean palette: ivory and cream grounds, sand and oatmeal neutrals, olive and sage actions,
   leafy green for good states, lemon as a cheerful highlight, tomato and terracotta as small accents. Light is the default;
   dark is an optional theme chosen in Settings (data-theme="dark") or via "follow system" (data-theme="system"). */
:root{
  --bg:#FBF7EF; --surface:#FFFDF8; --surface2:#F4EEE1; --surface3:#E9E1CE; --line:#E6DECB; --line2:#D1C6AC;
  --ink:#2E3628; --ink2:#5E6853; --ink3:#87907B;
  --accent:#5F7A4B; --accent-ink:#FFFFFF; --accent-soft:#E9EEDD; --accent-line:#B9C8A3;
  --good:#2F7A3E; --good-soft:#DDEFD8; --warn:#8A6400; --warn-soft:#FBF0B8; --bad:#B8432E; --bad-soft:#F9E1D9;
  --pet:#B4632A; --pet-soft:#F6E3D2; --lemon:#F4D35E; --lemon-soft:#FBF3C4; --peach:#F1B48E;
  --shadow:0 1px 2px rgba(70,60,30,.05),0 10px 26px -14px rgba(70,60,30,.20);
  --r:12px; --r-s:8px;
  --display:"Young Serif",Georgia,"Times New Roman",serif;
  --body:"Karla",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root[data-theme="system"]{
    --bg:#1D2019; --surface:#252921; --surface2:#2E332A; --surface3:#383E33; --line:#3A4034; --line2:#4E5647;
    --ink:#EEEBE0; --ink2:#B9B8A8; --ink3:#828776;
    --accent:#9DBB84; --accent-ink:#1B2416; --accent-soft:#2E3A28; --accent-line:#536548;
    --good:#7FC48A; --good-soft:#243A29; --warn:#E6C85A; --warn-soft:#3A3417; --bad:#E8836E; --bad-soft:#3F241F;
    --pet:#E1A16C; --pet-soft:#3E2E20; --lemon:#E6C85A; --lemon-soft:#3A3417; --peach:#C98A66;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px -14px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1D2019; --surface:#252921; --surface2:#2E332A; --surface3:#383E33; --line:#3A4034; --line2:#4E5647;
  --ink:#EEEBE0; --ink2:#B9B8A8; --ink3:#828776;
  --accent:#9DBB84; --accent-ink:#1B2416; --accent-soft:#2E3A28; --accent-line:#536548;
  --good:#7FC48A; --good-soft:#243A29; --warn:#E6C85A; --warn-soft:#3A3417; --bad:#E8836E; --bad-soft:#3F241F;
  --pet:#E1A16C; --pet-soft:#3E2E20; --lemon:#E6C85A; --lemon-soft:#3A3417; --peach:#C98A66;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px -14px rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;font-family:var(--display);font-weight:400;letter-spacing:-.005em;text-wrap:balance}
h1{font-size:27px;line-height:1.15}
h2{font-size:20px;line-height:1.2}
h3{font-size:16.5px;line-height:1.25}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink2)}
.faint{color:var(--ink3)}
.small{font-size:13px}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
p{margin:0}

.shell{display:grid;grid-template-columns:212px 1fr;min-height:100%}
.rail{position:sticky;top:0;align-self:start;height:100vh;height:100dvh;padding:22px 12px;display:flex;flex-direction:column;gap:4px;border-right:1px solid var(--line);background:var(--surface)}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px}
.brand .mark{width:30px;height:30px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--display);font-size:18px}
.brand .name{font-family:var(--display);font-size:21px}
.tab{display:flex;align-items:center;gap:10px;padding:8px 12px;border:0;border-radius:var(--r-s);background:transparent;color:var(--ink2);font-weight:500;text-align:left;width:100%}
.tab svg{width:18px;height:18px;flex:none}
.tab:hover{background:var(--surface2);color:var(--ink)}
.tab.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.rail .spacer{flex:1}
.storage{padding:10px 12px;font-size:12px;color:var(--ink3);display:flex;gap:8px;align-items:center}
.storage .dot{width:8px;height:8px;border-radius:50%;background:var(--ink3);flex:none}
.storage.cloud .dot{background:var(--good)}
main{padding:26px 28px 40px;max-width:1200px;width:100%;min-width:0}
.mob{display:none}
@media (max-width:820px){
  .shell{grid-template-columns:1fr}
  .rail{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));border-right:0;border-top:1px solid var(--line);z-index:20}
  .brand,.rail .spacer,.storage,.rail .desk{display:none}
  .mob{display:flex}
  .tab{flex-direction:column;gap:3px;padding:6px 2px;font-size:11px;width:auto;flex:1;align-items:center}
  .tab svg{width:22px;height:22px}
  main{padding:18px 16px calc(88px + env(safe-area-inset-bottom,0px))}
  h1{font-size:23px}
}

.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 18px;margin-bottom:18px}
.head .sub{margin-top:4px;color:var(--ink2)}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:var(--r-s);border:1px solid var(--line2);background:var(--surface);color:var(--ink);font-weight:500;line-height:1.2;white-space:nowrap}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink2)}
.btn.ghost:hover{background:var(--surface2);color:var(--ink)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 9px;font-size:13px}
.btn.icon{padding:6px;width:32px;height:32px;justify-content:center}
.btn svg{width:16px;height:16px}
.btn:disabled{opacity:.55;cursor:default}
.ai-only{display:none}
.ai .ai-only{display:inline-flex}
.ai .ai-block{display:block}
.ai-block{display:none}
.spark{color:var(--accent)}
.btn.primary .spark{color:inherit}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.card.pad{padding:16px 18px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0}
.tile .v{font-family:var(--display);font-size:25px;line-height:1.1;margin-top:6px;overflow-wrap:anywhere}
.tile .v small{font-family:var(--body);font-size:13px;font-weight:500;color:var(--ink2);margin-left:4px}
.tile .d{font-size:12.5px;color:var(--ink2);margin-top:4px}
.tile.hi{border-color:var(--accent-line);background:var(--accent-soft)}
.tile.bad .v{color:var(--bad)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;background:var(--surface2);color:var(--ink2);white-space:nowrap}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.pet{background:var(--pet-soft);color:var(--pet)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.pri{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ink3);flex:none}
.pri.essential{background:var(--accent)}
.pri.preferred{background:var(--warn)}
.pri.optional{background:var(--line2)}
.tag{display:inline-block;padding:2px 7px;border-radius:6px;font-size:11.5px;font-weight:600;background:var(--surface2);color:var(--ink2)}
.tag.pick{cursor:pointer;border:1px solid var(--line);padding:5px 10px;font-size:12.5px;background:var(--surface);width:auto;display:inline-flex;text-align:center;flex:none}
.tag.pick:hover{background:var(--surface2)}
.tag.pick.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-line)}
.meter{height:6px;border-radius:3px;background:var(--surface3);overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;border-radius:3px;background:var(--accent)}
.meter i.over{background:var(--bad)}
.meter i.warn{background:var(--warn)}
.meter i.pet{background:var(--pet)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;font-size:14px;align-items:baseline}
.kv b{font-weight:600}
.kv + .kv{border-top:1px solid var(--line)}
.kv .sub{display:block;font-size:12px;color:var(--ink3)}
.kv.total{border-top:2px solid var(--line2);font-weight:600}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;padding:9px 14px;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .grow{flex:1;min-width:0}
.li .grow small{display:block;color:var(--ink3);font-size:12px}
.li .amt{font-weight:600;white-space:nowrap}
.note{padding:10px 12px;border-radius:var(--r-s);background:var(--surface2);color:var(--ink2);font-size:13.5px}
.note.bad{background:var(--bad-soft);color:var(--bad)}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note.good{background:var(--good-soft);color:var(--good)}
.empty{padding:34px 22px;text-align:center;border:1px dashed var(--line2);border-radius:var(--r);color:var(--ink2)}
.empty h3{margin-bottom:6px}
.empty .actions{justify-content:center;margin-top:14px}

/* breakdown bars */
.bd{display:flex;flex-direction:column;gap:8px}
.bd .row{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;font-size:13.5px}
.bd .row .bbar{grid-column:1 / -1;height:8px;border-radius:4px;background:var(--surface3);overflow:hidden}
.bd .row .bbar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.bd .row .bbar i.pet{background:var(--pet)}
.bd .row .bbar i.buf{background:var(--line2)}
.stack{display:flex;height:14px;border-radius:7px;overflow:hidden;gap:2px;background:var(--surface3)}
.stack i{display:block;height:100%;min-width:0}

/* plan */
.weeknav{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.weeknav h1{min-width:200px}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.day{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.day.today{border-color:var(--accent-line);box-shadow:0 0 0 2px var(--accent-soft)}
.day .dh{display:flex;justify-content:space-between;align-items:baseline;padding:12px 14px 8px}
.day .dh b{font-weight:600}
.day .dh .date{color:var(--ink3);font-size:13px}
.day.today .dh .date{color:var(--accent);font-weight:600}
.slots{display:flex;flex-direction:column;gap:8px;padding:0 10px 10px;flex:1}
.slot{border:1px dashed var(--line2);border-radius:var(--r-s);padding:8px 10px;display:flex;flex-direction:column;gap:5px}
.slot.filled{border-style:solid;background:var(--surface2);border-color:transparent}
.slot .ml{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--ink3);display:flex;justify-content:space-between;align-items:center;gap:6px}
.slot .ml .addmini{all:unset;cursor:pointer;color:var(--ink3);font-size:14px;line-height:1;padding:0 3px}
.slot .ml .addmini:hover{color:var(--accent)}
.ent{display:flex;flex-direction:column;gap:3px;padding:4px 0;border-top:1px solid var(--line)}
.ent:first-of-type{border-top:0}
.ent .rn{font-family:var(--display);font-size:15px;line-height:1.25;display:flex;justify-content:space-between;gap:6px;align-items:flex-start}
.ent .rn button.nm{all:unset;cursor:pointer;font:inherit;color:inherit;flex:1}
.ent .rn button.nm:hover{color:var(--accent)}
.ent .rn .rm{all:unset;cursor:pointer;color:var(--ink3);font-size:14px;line-height:1;padding:0 2px}
.ent .rn .rm:hover{color:var(--bad)}
.ent.left .rn{color:var(--warn)}
.ent.item .rn{font-family:var(--body);font-weight:600;font-size:14px}
.ent .meta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--ink2);align-items:center}
.slot .add{all:unset;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;color:var(--ink3);font-weight:500;font-size:13px;padding:6px 0}
.slot .add:hover{color:var(--accent)}
.df{padding:10px 14px 12px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink2)}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line2);border-radius:6px;overflow:hidden;background:var(--surface)}
.stepper button{border:0;background:transparent;width:22px;height:20px;font-size:13px;line-height:1;color:var(--ink2)}
.stepper button:hover{background:var(--surface2);color:var(--ink)}
.stepper span{min-width:24px;text-align:center;font-size:12px;font-weight:600}
.progress{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--ink2)}
.progress b{color:var(--ink)}

/* recipes */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.search{flex:1;min-width:200px;display:flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid var(--line2);border-radius:var(--r-s);background:var(--surface)}
.search input{border:0;background:transparent;flex:1;min-width:0;outline:none}
.search svg{width:16px;height:16px;color:var(--ink3)}
.tagrow{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.rc{display:flex;flex-direction:column;gap:8px;padding:16px 16px 14px;text-align:left;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);transition:transform .12s ease,box-shadow .12s ease}
.rc:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.rc .rn{font-family:var(--display);font-size:18px;line-height:1.2}
.rc .fav{color:var(--warn)}
.rc .stats{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--ink2)}
.rc .tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:auto}

/* groceries */
.gwrap{display:grid;grid-template-columns:1fr 310px;gap:18px;align-items:start}
@media (max-width:940px){.gwrap{grid-template-columns:1fr}}
.aisle{margin-bottom:14px}
.aisle .ah{display:flex;justify-content:space-between;align-items:baseline;padding:8px 14px;border-bottom:1px solid var(--line)}
.gi{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--line)}
.gi:last-child{border-bottom:0}
.gi label{display:flex;align-items:center;gap:10px;flex:1;min-width:0;cursor:pointer}
.gi input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);margin:0;flex:none}
.gi .q{min-width:64px;color:var(--ink2);font-size:13.5px;text-align:right;flex:none}
.gi .n{flex:1;min-width:0}
.gi .n small{display:block;color:var(--ink3);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gi .price{font-size:13px;color:var(--ink2);white-space:nowrap}
.gi.done .n,.gi.done .q,.gi.done .price{text-decoration:line-through;color:var(--ink3)}
.gi.home{opacity:.65}
.gi .mini{all:unset;cursor:pointer;font-size:11.5px;font-weight:600;padding:3px 7px;border-radius:6px;color:var(--ink3);border:1px solid var(--line);white-space:nowrap}
.gi .mini:hover{color:var(--ink);background:var(--surface2)}
.side{position:sticky;top:20px;display:flex;flex-direction:column;gap:12px}
.side .card{padding:14px 16px}
form.inline{display:grid;grid-template-columns:1fr;gap:8px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12.5px;font-weight:600;color:var(--ink2)}
.field input,.field select,.field textarea{padding:8px 10px;border:1px solid var(--line2);border-radius:var(--r-s);background:var(--surface);min-width:0;width:100%}
.field textarea{min-height:90px;resize:vertical}
.row{display:flex;gap:8px}
.row > *{flex:1;min-width:0}
.checks{display:flex;gap:14px;flex-wrap:wrap}
.checks label{display:flex;align-items:center;gap:6px;font-weight:500}
.checks input{accent-color:var(--accent);width:16px;height:16px}

/* items */
.ic{display:flex;flex-direction:column;gap:6px;padding:14px 16px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);text-align:left}
.ic:hover{box-shadow:var(--shadow)}
.ic .t{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.ic .nm{font-weight:600;font-size:15px}
.ic .m{font-size:12.5px;color:var(--ink2);display:flex;flex-wrap:wrap;gap:3px 10px}
.igrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}

/* charts */
.bars{display:flex;align-items:flex-end;gap:2px;height:120px;padding-top:18px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;position:relative;border:0;background:none;padding:0}
.bar i{display:block;width:min(100%,38px);background:var(--accent);border-radius:4px 4px 0 0;min-height:2px}
.bar i.over{background:var(--bad)}
.bar i.est{background:var(--line2)}
.bar .pair{display:flex;gap:2px;align-items:flex-end;width:100%;justify-content:center;height:100%}
.bar .pair i{width:min(45%,18px)}
.bar .l{font-size:11.5px;color:var(--ink3);white-space:nowrap}
.bar .v{position:absolute;top:-16px;font-size:11.5px;color:var(--ink2);opacity:0}
.bar:hover .v,.bar.show .v{opacity:1}
.plot{position:relative}
.plot .ref{position:absolute;left:0;right:0;border-top:2px dashed var(--line2);pointer-events:none}
.plot .ref span{position:absolute;right:0;top:-18px;font-size:11px;color:var(--ink3);background:var(--surface);padding:0 4px}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--ink2);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--accent);vertical-align:-1px;margin-right:5px}
.legend i.est{background:var(--line2)}
.legend i.ref{width:12px;height:0;border-top:2px dashed var(--line2);border-radius:0;vertical-align:3px}

/* coach */
.chat{display:grid;grid-template-columns:1fr 300px;gap:18px;align-items:start}
@media (max-width:940px){.chat{grid-template-columns:1fr}}
.msgs{display:flex;flex-direction:column;gap:12px;margin-bottom:14px}
.msg{max-width:92%;padding:12px 14px;border-radius:14px;line-height:1.5;font-size:14.5px}
.msg.user{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.msg.ai{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg p + p{margin-top:6px}
.msg ul{margin:6px 0 0;padding-left:18px}

  if(ov===true)return {due:true,why:'Added for this week',override:true};if(ov===false)return {due:false,why:'Postponed',override:true};
  if(isMulti(it)){const st=petStatus(it);const weekEnd=addDays(parseISO(wkKey),6);const lastShop=addDays(weekEnd,7);if(st.runOut<=addDays(weekEnd,1))return {due:true,why:st.daysLeft<1?'Run out':'Runs out '+fmtDate(st.runOut)};if(st.runOut<=lastShop)return {due:false,why:'Runs out '+fmtDate(st.runOut)+', next week'};return {due:false,why:'Lasts until '+fmtDate(st.runOut)}}

const itemGroup=it=>it.group||(it.kind==='pet'?'pet':CAT_GROUP[it.category]||'pantry');

/* ================= inventory ================= */
function invIndex(){const idx={};for(const v of Object.values(S.inventory)){const c=canon(v.name);(idx[c]=idx[c]||[]).push({...v,fam:famOf(v.unit),base:(+v.qty||0)*famOf(v.unit).factor})}return idx}

/* ================= consolidated list ================= */
function newLine(key,cn,fam,category){return {key,canon:cn,fam,names:{},qty:0,recipeBase:0,recipeCost:0,extraBase:0,extraCost:0,itemBase:0,itemCost:0,cost:0,sources:[],groups:{},meals:{},category,priority:null,items:[],recipes:new Set(),extras:null}}
function mergeInto(t,l,f){t.qty+=l.qty*f;t.recipeBase+=l.recipeBase*f;t.extraBase+=l.extraBase*f;t.itemBase+=l.itemBase*f;t.recipeCost+=l.recipeCost;t.extraCost+=l.extraCost;t.itemCost+=l.itemCost;t.cost+=l.cost;
  for(const n in l.names)t.names[n]=(t.names[n]||0)+l.names[n];l.sources.forEach(s=>{if(!t.sources.includes(s))t.sources.push(s)});for(const g in l.groups)t.groups[g]=(t.groups[g]||0)+l.groups[g];for(const m in l.meals)t.meals[m]=(t.meals[m]||0)+l.meals[m];
  t.items.push(...l.items);l.recipes.forEach(r=>t.recipes.add(r));if(l.extras)t.extras=[...(t.extras||[]),...l.extras];t.priority=higherPrio(t.priority,l.priority)}
function packPlan(cn,famKey,need,packBase,mustBuyOne){const p=PACKS[cn];const sizes=(p&&p[0]===(famKey==='count:pcs'?'count':famKey)&&p[1].length)?[...p[1]].sort((a,b)=>a-b):(packBase>0?[packBase]:[]);
  const show=s=>famKey.startsWith('count')?fmtBase(s,famKey):fmtBase(s,famKey);
  if(!sizes.length)return {total:Math.max(0,need),label:''};
  if(need<=1e-9)return mustBuyOne?{total:sizes.find(s=>s>=packBase)||packBase||sizes[0],label:`buy 1 × ${show(sizes.find(s=>s>=packBase)||packBase||sizes[0])}`}:{total:0,label:''};
  const mx=sizes[sizes.length-1];let n=Math.floor(need/mx+1e-9);let rem=need-n*mx;const parts=[];let total=n*mx;
  if(rem>1e-9){const small=sizes.find(s=>s>=rem-1e-9);if(small){total+=small;if(small===mx)n++;else parts.push(`1 × ${show(small)}`)}}
  if(n>0)parts.unshift(`${n} × ${show(mx)}`);return {total,label:'buy '+parts.join(' + ')}}
function buildList(wk,wkKey){wk=wk||week();wkKey=wkKey||S.ui.weekKey;const lines={};
  const add=o=>{const fam=famOf(o.unit);const cn=canon(o.name)||String(o.name).toLowerCase();const key=cn+'|'+fam.key;let L=lines[key];if(!L)L=lines[key]=newLine(key,cn,fam,o.category||guessCat(o.name));
    const base=(+o.qty||0)*fam.factor,cost=+o.cost||0;L.names[o.name]=(L.names[o.name]||0)+1;L.qty+=base;L.cost+=cost;
    if(o.item){L.itemBase+=base;L.itemCost+=cost;L.items.push(o.item)}else if(o.extra){L.extraBase+=base;L.extraCost+=cost;(L.extras=L.extras||[]).push(o.extra)}else{L.recipeBase+=base;L.recipeCost+=cost;if(o.recipeId)L.recipes.add(o.recipeId)}
    if(o.source&&!L.sources.includes(o.source))L.sources.push(o.source);L.groups[o.group]=(L.groups[o.group]||0)+cost;if(o.meal)L.meals[o.meal]=(L.meals[o.meal]||0)+cost;if(o.priority)L.priority=higherPrio(L.priority,o.priority)};
  for(const e of planEntries(wk))if(e.type==='recipe')for(const l of recipeLines(e.recipe,e.servings,e.meal))add(l);
  for(const it of Object.values(S.items)){const d=itemDue(it,wk,wkKey);if(!d.due)continue;const c=itemCosts(it);
    add({name:it.name,unit:isMulti(it)?(it.packageUnit||''):(it.unit||''),qty:isMulti(it)?+it.packageSize:(+it.qty||1),cost:c.actual,category:it.category||guessCat(it.name),group:itemGroup(it),source:it.kind==='pet'?petName():(it.brand?it.brand:'Regular item'),priority:it.priority||'preferred',item:it})}
  for(const x of (wk.extras||[]))add({name:x.name,unit:x.unit||'',qty:+x.qty||0,cost:+x.price||0,category:x.category||guessCat(x.name),group:x.group||CAT_GROUP[x.category]||'pantry',source:'Added by you',priority:x.priority||'optional',extra:x});
  // pass 2: merge unit families that describe the same product (spoons into weight/volume, slices into loaves)
  const byCanon={};for(const k in lines)(byCanon[lines[k].canon]=byCanon[lines[k].canon]||[]).push(lines[k]);
  for(const cn in byCanon){const arr=byCanon[cn];if(arr.length<2)continue;const tgt=arr.find(l=>l.fam.key==='mass')||arr.find(l=>l.fam.key==='vol');
    if(tgt)for(const l of arr){if(l===tgt||l.fam.key!=='spoon')continue;mergeInto(tgt,l,5);delete lines[l.key]}
    const loaf=arr.find(l=>l.fam.key==='count:loaf'),slice=arr.find(l=>l.fam.key==='count:slice');if(loaf&&slice){mergeInto(loaf,slice,1/16);delete lines[slice.key]}
    const pcs=arr.find(l=>l.fam.key==='count:pcs');for(const l of arr){if(pcs&&l!==pcs&&(l.fam.key==='count:can'||l.fam.key==='count:bottle'||l.fam.key==='count:pack'||l.fam.key==='count:bag')&&l.items.length===0&&pcs.items.length){mergeInto(pcs,l,1);delete lines[l.key]}}}
  const inv=invIndex();const out=[];
  for(const L of Object.values(lines)){
    L.name=cap(Object.entries(L.names).sort((a,b)=>b[1]-a[1]||a[0].length-b[0].length)[0][0]);L.fullCost=L.cost;L.atHome=null;
    const multi=L.items.some(isMulti);const have=inv[L.canon];let haveQ=0,untracked=false;
    if(have&&!multi){const same=have.filter(h=>h.fam.key===L.fam.key&&h.base>0);untracked=have.some(h=>!(+h.qty>0));haveQ=same.reduce((a,h)=>a+h.base,0)}
    let need=L.recipeBase+L.extraBase;
    if(L.items.length&&!multi){const it=L.items.find(i=>+i.price>0)||L.items[0];const packBase=Math.max(1e-9,(+it.qty||1)*famOf(it.unit).factor);
      if(untracked||(haveQ>=packBase-1e-9&&haveQ>=need-1e-9)){L.atHome={all:true,label:untracked?'At home':'At home: '+fmtBase(haveQ,L.fam)};L.needBase=0;L.cost=0;L.pack=''}
      else{const needAfter=Math.max(0,need-haveQ);if(haveQ>0)L.atHome={all:false,label:'Have '+fmtBase(haveQ,L.fam)+' at home'};
        const plan=packPlan(L.canon,L.fam.key,needAfter,packBase,true);L.needBase=plan.total;L.pack=plan.label;
        const unitPrice=+it.price>0?(+it.price)/packBase:(L.itemCost+L.recipeCost+L.extraCost)/Math.max(L.qty,1e-9);L.cost=plan.total*unitPrice}}
    else if(multi){L.needBase=L.qty;L.pack=''}
    else{let needAfter=need;if(untracked){L.atHome={all:true,label:'At home'};needAfter=0}else if(haveQ>=need-1e-9&&haveQ>0){L.atHome={all:true,label:'At home: '+fmtBase(haveQ,L.fam)};needAfter=0}else if(haveQ>0){needAfter=need-haveQ;L.atHome={all:false,label:'Have '+fmtBase(haveQ,L.fam)+' at home'}}

  out.sort((a,b)=>(a.staple-b.staple)||CATS.indexOf(a.category)-CATS.indexOf(b.category)||a.name.localeCompare(b.name));return out}

/* ================= budget summary ================= */
function budgetSummary(wk,wkKey){wk=wk||week();wkKey=wkKey||S.ui.weekKey;const s=S.settings;const L=buildList(wk,wkKey);
  const g={};GROUPS.forEach(x=>g[x]={actual:0,normalized:0});const meals={};MEAL_TYPES.forEach(m=>meals[m]=0);
  for(const l of L){if(l.atHome&&l.atHome.all)continue;const tot=Object.values(l.groups).reduce((a,b)=>a+b,0)||1;for(const k in l.groups){const share=l.groups[k]/tot*l.cost;g[k].actual+=share;if(!l.items.length)g[k].normalized+=share}const mt=Object.values(l.meals).reduce((a,b)=>a+b,0)||1;for(const m in l.meals)meals[m]+=l.meals[m]/mt*(l.groups.meals||0)/tot*l.cost}
  for(const it of Object.values(S.items)){const c=itemCosts(it);g[itemGroup(it)].normalized+=c.normalized}
  const actual=GROUPS.reduce((a,k)=>a+g[k].actual,0),normalized=GROUPS.reduce((a,k)=>a+g[k].normalized,0);
  const budget=+s.weeklyBudget||0,buffer=+s.buffer||0;
  const remaining=budget-buffer-actual;const nonMealNorm=GROUPS.filter(k=>k!=='meals').reduce((a,k)=>a+g[k].normalized,0);const availableForMeals=budget-buffer-nonMealNorm;
  const overBy=Math.max(0,actual+buffer-budget);
  const dueMulti=Object.values(S.items).filter(it=>isMulti(it)&&itemDue(it,wk,wkKey).due);
  const cand=L.filter(l=>!(l.atHome&&l.atHome.all)&&l.cost>0&&!l.staple).map(l=>({line:l,prio:l.priority||(l.items.length?'preferred':'essential'),pet:l.items.some(i=>i.kind==='pet')})).filter(c=>c.prio!=='essential'&&!(c.pet&&c.prio==='essential'));
  cand.sort((a,b)=>prioRank(b.prio)-prioRank(a.prio)||b.line.cost-a.line.cost);
  const suggestions=[];let saved=0;for(const c of cand){if(saved>=overBy)break;suggestions.push(c);saved+=c.line.cost}
  const reused=L.filter(l=>l.recipes.length>=2);const leftovers=planEntries(wk).filter(e=>e.type==='leftovers');const atHome=L.filter(l=>l.atHome);
  const essentialsDue=L.filter(l=>l.priority==='essential'&&l.items.length&&!(l.atHome&&l.atHome.all));
  const postponed=Object.values(S.items).filter(it=>(wk.buy||{})[it.id]===false);
  const spent=(wk.trips||[]).reduce((a,t)=>a+(+t.amount||0),0);
  return {lines:L,groups:g,meals,actual,normalized,budget,buffer,remaining,availableForMeals,overBy,dueMulti,suggestions,saved,reused,leftovers,atHome,essentialsDue,postponed,spent,toBuy:L.filter(l=>!(l.atHome&&l.atHome.all))}}
function dayNutrition(d,wk){wk=wk||week();let kcal=0,protein=0,n=0;for(const m of MEAL_TYPES)for(const e of slotEntries(wk,d,m)){let r=null;if(e.t==='r')r=S.recipes[e.id];else if(e.t==='l')r=S.recipes[e.of];if(!r||!r.nutrition)continue;kcal+=+r.nutrition.kcal||0;protein+=+r.nutrition.protein||0;n++}return {kcal,protein,n}}

/* ================= plan entries ================= */
function addEntry(day,meal,entry,replace,wk){const w=wk||week();w.slots=w.slots||{};w.slots[day]=w.slots[day]||{};const multi=['snack','drink','treat'].includes(meal);const cur=w.slots[day][meal]||[];w.slots[day][meal]=(replace&&!multi)?[entry]:[...cur,entry];return w}

/* ================= price memory (from confirmed receipts) ================= */
function robustUnitPrice(samples){const vals=(samples||[]).map(s=>+s.unitPrice).filter(v=>v>0);if(!vals.length)return null;const sorted=[...vals].sort((a,b)=>a-b);const med=sorted[Math.floor(sorted.length/2)];const kept=vals.length>=3?vals.filter(v=>Math.abs(v-med)/med<=0.4):vals;if(!kept.length)return med;const s2=[...kept].sort((a,b)=>a-b);return s2[Math.floor(s2.length/2)]}
function priceMemoryFor(cn,famKey){const p=S.prices&&S.prices[cn];if(!p||p.fam!==famKey)return null;const up=robustUnitPrice(p.samples);if(!up)return null;const last=(p.samples||[])[p.samples.length-1]||{};return {unitPrice:up,store:last.store||'',samples:(p.samples||[]).length}}
function recordPrice(cn,famKey,unitPrice,store,date){if(!(unitPrice>0))return null;const p=S.prices[cn]&&S.prices[cn].fam===famKey?clone(S.prices[cn]):{id:cn,fam:famKey,samples:[]};p.samples.push({unitPrice:Math.round(unitPrice*1e6)/1e6,store:store||'',date:date||iso(today())});if(p.samples.length>8)p.samples=p.samples.slice(-8);p.updatedAt=Date.now();S.prices[cn]=p;return p}

/* ================= allergens & dietary ================= */
const ALLERGENS=['gluten','dairy','eggs','peanuts','tree nuts','soy','fish','shellfish','sesame'];
const ALLERGEN_WORDS={gluten:/\b(wheat|flour|bread|pasta|spaghetti|noodle|couscous|bulgur|barley|rye|breadcrumb|tortilla|wrap|pitta|pita|oat|oats|seitan|soy sauce)\b/i,dairy:/\b(milk|cheese|cheddar|parmesan|feta|halloumi|mozzarella|yogurt|yoghurt|butter|cream|ghee|paneer)\b/i,eggs:/\b(egg|eggs|mayonnaise|mayo|caesar dressing)\b/i,peanuts:/\b(peanut|peanuts|peanut butter|satay)\b/i,'tree nuts':/\b(almond|walnut|cashew|pecan|hazelnut|pistachio|macadamia|pine nut|nuts?)\b/i,soy:/\b(soy|soya|tofu|tempeh|edamame|miso|soy sauce)\b/i,fish:/\b(salmon|tuna|cod|haddock|anchov|sardine|mackerel|trout|fish)\b/i,shellfish:/\b(prawn|shrimp|crab|lobster|mussel|clam|scallop|oyster|squid)\b/i,sesame:/\b(sesame|tahini)\b/i};
function recipeAllergens(r){const found=new Set((r.allergens||[]).filter(a=>ALLERGENS.includes(a)));for(const i of (r.ingredients||[]))for(const a of ALLERGENS)if(ALLERGEN_WORDS[a].test(i.name||''))found.add(a);return [...found]}
function violatesAllergies(r,allergies){const al=(allergies||S.settings.allergies||[]);if(!al.length)return [];const has=recipeAllergens(r);return al.filter(a=>has.includes(a))}
function recipeDiets(r){const tags=new Set(r.tags||[]);const names=(r.ingredients||[]).map(i=>i.name||'').join(' ');const meat=/\b(chicken|beef|pork|turkey|mince|lamb|bacon|sausage|steak|ham)\b/i.test(names);const fish=ALLERGEN_WORDS.fish.test(names)||ALLERGEN_WORDS.shellfish.test(names);const dairy=ALLERGEN_WORDS.dairy.test(names);const eggs=ALLERGEN_WORDS.eggs.test(names);const gluten=ALLERGEN_WORDS.gluten.test(names);
  if(!meat&&!fish)tags.add('vegetarian');if(!meat&&!fish&&!dairy&&!eggs&&!/\bhoney\b/i.test(names))tags.add('vegan');if(!gluten)tags.add('gluten-free');if(!dairy)tags.add('dairy-free');if(r.nutrition&&+r.nutrition.protein>=25)tags.add('high-protein');return [...tags]}

function enrichRecipe(r){if(!r)return r;if(!r.mealTypes||!r.mealTypes.length)r.mealTypes=['dinner'];if(!r.source)r.source={type:r.id&&String(r.id).startsWith('s_')?'starter':'manual',name:r.id&&String(r.id).startsWith('s_')?'Plenty starter recipe':'My recipes'};if(r.prepMinutes==null&&r.cookMinutes==null&&r.minutes){r.prepMinutes=Math.max(2,Math.round(r.minutes*0.35));r.cookMinutes=Math.max(0,r.minutes-r.prepMinutes)}if(!r.minutes&&(r.prepMinutes||r.cookMinutes))r.minutes=(+r.prepMinutes||0)+(+r.cookMinutes||0);return r}

      ${B.overBy>0&&B.suggestions.length?`<div class="note bad" style="margin-top:8px">Try postponing ${B.suggestions.map(c=>`<b>${esc(c.line.name)}</b>`).join(', ')} to save ${money(B.saved)}.</div>`:''}

/* ================= Ask Plenty (assistant) ================= */
const QUICK=['Create my full grocery plan for this week under budget, with breakfast, lunch, dinner and snacks.','What can I remove without touching the essentials?','Use dinner leftovers for lunch where it makes sense.','How much of my budget goes to actual meals versus other groceries?','Give me work snacks that are healthy but not boring.','Can I afford salmon this week?','Am I eating reasonably balanced this week?','Could I eat less meat without losing protein variety?','Make this plan more cholesterol-conscious, within budget.','Suggest a healthier snack, but keep one treat.'];
function fmtReply(t){return String(t||'').split(/\n{2,}/).map(par=>{const lines=par.split('\n');if(lines.every(l=>/^\s*[-•*]\s+/.test(l)))return '<ul>'+lines.map(l=>'<li>'+esc(l.replace(/^\s*[-•*]\s+/,''))+'</li>').join('')+'</ul>';return '<p>'+lines.map(esc).join('<br>')+'</p>'}).join('')}
function describeAction(a){const r=id=>(S.recipes[id]||{}).name||id;const it=id=>(S.items[id]||{}).name||id;const day=d=>DAYS_LONG[+d]||d;
  switch(a.type){
    case 'set_slot':return `${day(a.day)} ${a.meal}: ${a.leftoversOf?'leftovers of '+r(a.leftoversOf):a.recipeId?r(a.recipeId)+(a.servings?` (cook ×${a.servings})`:''):a.itemId?it(a.itemId):a.name||'?'}${a.replace===false?' (added)':''}`;
    case 'clear_slot':return `Clear ${day(a.day)} ${a.meal}`;
    case 'set_item_buy':return `${a.buy?'Buy':'Postpone'} ${it(a.itemId)} this week`;
    case 'add_extra':return `Add to list: ${a.qty||''} ${a.unit||''} ${a.name} (${money(a.price||0)}, ${a.priority||'optional'})`;
    case 'remove_extra':return `Remove from list: ${a.name}`;
    case 'add_inventory':return `At Home: ${a.qty?a.qty+' '+(a.unit||''):'have'} ${a.name}${a.location?' ('+a.location+')':''}`;
    case 'remove_inventory':return `At Home: used up ${a.name}`;
    case 'set_budget':return `Set weekly budget to ${money(a.amount)}`;
    case 'set_buffer':return `Set buffer to ${money(a.amount)}`;
    case 'set_store':return `Shop at ${a.store}`;
    case 'add_item':return `New regular item: ${a.name} (${money(a.price||0)}, ${a.frequency||'weekly'}, ${a.priority||'preferred'})`;
    case 'update_item':return `Update ${it(a.itemId)}: ${Object.entries(a.patch||{}).map(([k,v])=>k+' = '+v).join(', ')}`;
    case 'new_recipe':return `New recipe: ${(a.recipe||{}).name||'?'}`;

/* ---- AI recipe import / generate ---- */
const RECIPE_SHAPE=()=>`Reply with only a JSON object of this exact shape:
{"name":string,"mealTypes":string[] (from: ${MEAL_TYPES.join(', ')}),"tags":string[] (from: ${TAGS.join(', ')}),"minutes":number,"servings":number,"ingredients":[{"qty":number,"unit":one of ${UNITS.filter(Boolean).map(u=>'"'+u+'"').join('|')} or "","name":string,"category":one of ${CATS.map(a=>'"'+a+'"').join('|')},"price":number (cost in ${S.settings.currency} of exactly this quantity, pro-rata of a pack)}],"steps":string[],"nutrition":{"kcal":number,"protein":number,"carbs":number,"fat":number} per single serving,"notes":string (leftover or storage tip, may be empty)}`;
function coerceRecipe(j){if(!j||typeof j!=='object'||!j.name)throw {code:'invalid_json'};
  const ings=Array.isArray(j.ingredients)?j.ingredients.map(i=>({qty:+i.qty||0,unit:UNITS.includes(i.unit)?i.unit:String(i.unit||''),name:String(i.name||'').trim(),category:CATS.includes(i.category)?i.category:guessCat(i.name),price:Math.round((+i.price||0)*100)/100})).filter(i=>i.name):[];const n=j.nutrition||{};
  const mt=Array.isArray(j.mealTypes)?j.mealTypes.filter(m=>MEAL_TYPES.includes(m)):[];
  return {id:uid(),name:String(j.name).trim(),mealTypes:mt.length?mt:['dinner'],tags:Array.isArray(j.tags)?j.tags.filter(t=>TAGS.includes(t)).slice(0,6):[],minutes:+j.minutes||30,servings:Math.max(1,Math.round(+j.servings||2)),ingredients:ings,steps:Array.isArray(j.steps)?j.steps.map(String):[],nutrition:{kcal:Math.round(+n.kcal||0),protein:Math.round(+n.protein||0),carbs:Math.round(+n.carbs||0),fat:Math.round(+n.fat||0)},nutritionEstimated:true,notes:String(j.notes||''),createdAt:Date.now()}}
function openAiRecipe(mode,slot){const isImport=mode==='import';
  openModal(`${mhead(isImport?'Import a recipe':'Generate a recipe',isImport?'Paste the text of any recipe. Claude turns it into a structured, priced card you review before saving.':'Describe what you fancy. Claude drafts a recipe with per-ingredient prices and nutrition for you to review.')}
    <div class="mb"><div class="field"><label for="aiIn">${isImport?'Recipe text':'What do you want?'}</label><textarea id="aiIn" style="min-height:${isImport?180:90}px" placeholder="${isImport?'Copy the ingredients and method from a website or your notes and paste here.':'e.g. a quick high-protein lunch I can prep for three days, or a cheap vegetarian dinner that makes good leftovers'}"></textarea></div>
    ${!isImport&&S.settings.diet?`<div class="small faint">Your preferences are included: “${esc(S.settings.diet.slice(0,140))}${S.settings.diet.length>140?'…':''}”</div>`:''}<div id="aiOut"></div></div>
    <div class="mf"><button class="btn ghost" data-close>Cancel</button><div class="actions"><button class="btn ghost" id="aiStop" hidden>Stop</button><button class="btn primary" id="aiGo">${ICONS.spark} ${isImport?'Structure it':'Draft recipe'}</button></div></div>`);
  let ctl=null;document.getElementById('aiStop').onclick=()=>ctl&&ctl.abort();
  document.getElementById('aiGo').onclick=async()=>{const txt=document.getElementById('aiIn').value.trim();if(!txt||!sampleFn)return;const out=document.getElementById('aiOut'),go=document.getElementById('aiGo'),stop=document.getElementById('aiStop');out.innerHTML='<div class="thinking"><span class="sp"></span>Thinking…</div>';go.disabled=true;stop.hidden=false;ctl=new AbortController();
    const B=budgetSummary();const prompt=isImport?`Convert this recipe text into structured data. Keep the author's ingredients and steps faithfully; normalise to metric (g, ml) where weights or volumes are given, otherwise use pcs. Estimate per-ingredient prices in ${S.settings.currency}${S.settings.store?' at '+S.settings.store:''} and nutrition per serving if not given.\n\n${RECIPE_SHAPE()}\n\nRECIPE TEXT:\n${txt.slice(0,20000)}`
      :`Create one home-cook recipe for ${S.settings.people} ${S.settings.people===1?'person':'people'}. Budget context: about ${money(B.availableForMeals)} is available for all planned recipes this week. Request: ${txt}\n${slot?`It is for ${MEAL_LABEL[slot.meal]}.\n`:''}${S.settings.diet?'Standing preferences: '+S.settings.diet+'\n':''}Use common supermarket ingredients, metric units, realistic quantities and a sensible servings count for leftovers.\n\n${RECIPE_SHAPE()}`;
    try{const j=await sampleFn.json(prompt,{signal:ctl.signal,cache:false});const r=coerceRecipe(j);if(slot&&!r.mealTypes.includes(slot.meal))r.mealTypes.push(slot.meal);closeModal();
      openEditor(r,{sub:'Review, then save',notice:isImport?'Structured by Claude from your text. Check quantities and prices before saving.':'Drafted by Claude. Prices and nutrition are estimates.',then:slot?saved=>{addEntry(slot.day,slot.meal,{t:'r',id:saved.id,sv:S.settings.people||1},true);saveWeek();S.ui.tab='plan';render()}:null})}
    catch(e){if(e&&e.code==='cancelled')out.innerHTML='';else out.innerHTML=`<div class="note bad">${aiErr(e)}</div>`}finally{go.disabled=false;stop.hidden=true}}}

/* ================= Ask Plenty assistant: prompt, validation, application ================= */
function coachContext(){const s=S.settings;const B=budgetSummary();const wk=week();const pn=petName();
  const recipes=recipeList().map(r=>`${r.id} | ${r.name} | ${(r.mealTypes||['dinner']).join('/')} | ${(r.tags||[]).join(',')} | ${r.minutes} min | makes ${r.servings} | ${r.nutrition?r.nutrition.kcal+' kcal, '+r.nutrition.protein+' g protein':'no nutrition'} | ${money(recipeCost(r))}/serving${r.favorite?' | favourite':''}`).join('\n');

const COACH_RULES=()=>`You are Ask Plenty, the planning assistant inside the Plenty app, for one household. You are not a coach, nutritionist, dietitian or financial advisor and never claim to be. You reason about the COMPLETE grocery week: recipes for every planned meal type, breakfast and lunch staples, fruit, snacks, drinks, coffee/tea, pantry restocking, ${petName()}'s supplies, household items, one-off extras and the buffer. Never treat dinners as the whole budget.

function validateAction(a){const pn=petName();if(!a||typeof a!=='object')return {ok:false,why:'Malformed'};

    case 'clear_slot':return (a.day>=0&&a.day<=6&&MEAL_TYPES.includes(a.meal))?{ok:true}:{ok:false,why:'Unknown day or meal'};
    case 'set_item_buy':{const it=S.items[a.itemId];if(!it)return {ok:false,why:'Item not found'};if(a.buy===false&&(it.priority||'preferred')==='essential')return {ok:false,why:it.kind==='pet'?`Blocked: ${pn}'s essential supply is never postponed`:'Blocked: essential items are never postponed'};return {ok:true}}

    case 'set_budget':return +a.amount>0?{ok:true}:{ok:false,why:'Amount must be positive'};
    case 'set_buffer':return +a.amount>=0?{ok:true}:{ok:false,why:'Amount must be zero or more'};

function shuffleWeek(){const list=recipeList();if(!list.length)return;const wk=week();const people=S.settings.people||1;const used=new Set(planEntries().filter(e=>e.type==='recipe').map(e=>e.recipe.id));let n=0;

  return {ok:lines.length>0,store:String(j.store||'').trim(),date:/^\d{4}-\d{2}-\d{2}$/.test(String(j.date||''))?j.date:iso(today()),total:num(j.total),tax:num(j.tax)||0,discount:num(j.discount)||0,lines,error:lines.length?'':'No line items were recognised on this receipt.'}}
function tokenOverlap(a,b){const A=new Set(String(a).split(' ').filter(w=>w.length>2)),Bs=new Set(String(b).split(' ').filter(w=>w.length>2));if(!A.size||!Bs.size)return 0;let n=0;for(const w of A)if(Bs.has(w))n++;return n/Math.min(A.size,Bs.size)}
function matchReceiptLines(recLines,listLines){const used=new Map();const rows=recLines.map((rl,i)=>{const cn=canon(rl.name);let best=null,bestScore=0;for(const L of listLines){if(L.atHome&&L.atHome.all)continue;const score=L.canon===cn?1:tokenOverlap(cn,L.canon);if(score>bestScore){bestScore=score;best=L}}
    if(bestScore<0.5)best=null;let status=best?'planned':'unplanned';if(best){if(used.has(best.key)){status='duplicate'}else used.set(best.key,i)}
    const pet=best?best.items.some(x=>x.kind==='pet'):/dog|cat|pet|kibble|treats?|chews?/i.test(rl.name);
    return {...rl,canon:cn,matchKey:best?best.key:null,matchName:best?best.name:'',est:best?Math.round(best.cost*100)/100:null,diff:best?Math.round((rl.price-best.cost)*100)/100:null,status,category:rl.category||(best?best.category:(pet?'Pet':guessCat(rl.name))),priority:best?(best.priority||(best.items.length?'preferred':'essential')):'optional',pet,famKey:best?best.fam.key:null,needBase:best?best.needBase:null}});
  const notPurchased=listLines.filter(L=>!(L.atHome&&L.atHome.all)&&!used.has(L.key)&&!L.staple).map(L=>({key:L.key,name:L.name,est:Math.round(L.cost*100)/100,category:L.category,priority:L.priority||(L.items.length?'preferred':'essential'),pet:L.items.some(x=>x.kind==='pet')}));
  return {rows,notPurchased}}
function receiptCategoryTotals(trips){const out={};for(const t of trips||[])for(const l of (t.lines||[])){if(l.status==='skip'||l.status==='duplicate')continue;const c=l.pet?'Pet':(l.category||'Other');out[c]=(out[c]||0)+(+l.price||0)}return out}
function applyReceiptToPrices(trip){let n=0;for(const l of (trip.lines||[])){if(l.status!=='planned'||!(l.price>0)||!l.canon||!l.famKey||!(l.needBase>0))continue;const unitPrice=l.price/l.needBase;if(recordPrice(l.canon,l.famKey,unitPrice,trip.store,trip.date)){n++;writeDoc('prices/'+l.canon,S.prices[l.canon])}}return n}

function openRecipe(id,opts){opts=opts||{};let r=getRecipe(id);if(!r)return;prepRecipe(r);let sv=opts.servings||S.settings.people||1;noteViewed(id);

function ensureSaved(r){if(S.recipes[r.id])return S.recipes[r.id];const c=clone(r);delete c._detailed;c.createdAt=Date.now();S.recipes[c.id]=c;writeDoc('recipes/'+c.id,c);return c}
function openAddFlow(id,pre){const r=getRecipe(id);if(!r)return;pre=pre||{};const slot=pre.slot||S.ui.disc.slot;const st={day:slot?slot.day:(pre.day!=null?pre.day:-1),meal:slot?slot.meal:(pre.meal||(r.mealTypes||['dinner'])[0]),sv:pre.sv||S.settings.people||1,postpone:[],replaceEntry:null,week:'this'};
  if(st.day<0){for(let d=0;d<7;d++)if(!slotEntries(week(),d,st.meal).length){st.day=d;break}if(st.day<0)st.day=0}
  const draw=()=>{const sim=simulateAdd(st.day,st.meal,r,st.sv,true,{postpone:st.postpone});const cur=slotEntries(week(),st.day,st.meal);const multi=['snack','drink','treat'].includes(st.meal);const replacing=cur.length&&!multi;
    document.getElementById('modal').innerHTML=`<div class="overlay"><div class="modal" role="dialog" aria-modal="true">${mhead('Add to plan',esc(r.name))}<div class="mb">
      <div class="field"><label>Day</label><div class="dayrow">${DAYS.map((d,i)=>{const dt=addDays(parseISO(S.ui.weekKey),i);const has=slotEntries(week(),i,st.meal).length;return `<button type="button" class="${st.day===i?'on':''}" data-day="${i}">${d}<small>${has?'●':fmtDate(dt).split(' ')[0]}</small></button>`}).join('')}</div></div>
      <div class="field"><label>Meal type</label><div class="mealrow">${activeMeals().map(m=>`<button type="button" class="tag pick ${st.meal===m?'on':''}" data-meal="${m}">${MEAL_LABEL[m]}${(r.mealTypes||[]).includes(m)?'':' ·'}</button>`).join('')}</div></div>
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><label class="small" style="font-weight:600;color:var(--ink2)">Servings to cook</label><span class="stepper"><button data-sv="-1" aria-label="Fewer">−</button><span>${st.sv}</span><button data-sv="1" aria-label="More">+</button></span></div>
      ${replacing?`<div class="note warn">${DAYS_LONG[st.day]} ${st.meal} already has <b>${esc(cur.map(e=>e.t==='r'?(S.recipes[e.id]||{}).name:e.t==='l'?'leftovers':(S.items[e.id]||{}).name).join(', '))}</b>. Adding here replaces it.</div>`:''}
      <div class="impact"><div class="eyebrow" style="margin-bottom:6px">Summary</div>
        <div class="kv"><span>${DAYS_LONG[st.day]} · ${MEAL_LABEL[st.meal]} · ${st.sv} serving${st.sv===1?'':'s'}</span><b class="num">${money(sim.recipeCostTotal)}</b></div>
        <div class="kv"><span>New ingredients required</span><b class="num">${sim.newLines.length}${sim.newLines.length?` <span class="faint small" style="font-weight:400">${esc(sim.newLines.slice(0,4).map(l=>l.name).join(', '))}${sim.newLines.length>4?'…':''}</span>`:''}</b></div>
        <div class="kv"><span>Already at home</span><b class="num">${sim.atHome.length}</b></div><div class="kv"><span>Reused elsewhere this week</span><b class="num">${sim.shared.filter(l=>l.recipes.length>=2).length}</b></div>
        <div class="kv total"><span>New estimated checkout</span><b class="num">${money(sim.after.actual)} <span class="faint small" style="font-weight:400">(${sim.delta>=0?'+':'−'}${money(Math.abs(sim.delta))})</span></b></div>
        <div class="kv"><span>${sim.after.remaining>=0?'Remaining weekly budget':'Over weekly budget'}</span><b class="num" style="color:${sim.after.remaining>=0?'var(--good)':'var(--bad)'}">${money(Math.abs(sim.after.remaining))}</b></div>
        ${st.postpone.length?`<div class="small muted">Also postponing: ${esc(st.postpone.map(i=>(S.items[i]||{}).name).join(', '))}</div>`:''}
        ${sim.warning?`<div class="note ${sim.overBy>0?'bad':'warn'}" style="margin-top:8px">${esc(sim.warning)} You stay in control; here are ways to make it fit:</div>
          <div class="opts">${sim.options.cheaper.length?`<button class="btn sm" data-opt="cheaper">Use a cheaper option</button>`:''}${sim.options.reducePortions?`<button class="btn sm" data-opt="portions">Reduce to ${S.settings.people||1} portion${(S.settings.people||1)===1?'':'s'}</button>`:''}${sim.options.replace.length?`<button class="btn sm" data-opt="replace">Replace another planned recipe</button>`:''}${sim.options.removeOptional.length?`<button class="btn sm" data-opt="optional">Remove an optional grocery item</button>`:''}<button class="btn sm" data-opt="next">Save it for next week</button></div><div id="optBox"></div>`:''}
      </div></div>
      <div class="mf"><button class="btn ghost" data-close>Cancel</button><div class="actions"><button class="btn primary" id="addConfirm">${st.week==='next'?'Add to next week':replacing?'Replace and add':'Add to plan'}</button></div></div></div></div>`;
    const box=document.querySelector('.modal');
    box.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{st.day=+b.dataset.day;draw()});box.querySelectorAll('[data-meal]').forEach(b=>b.onclick=()=>{st.meal=b.dataset.meal;draw()});box.querySelectorAll('[data-sv]').forEach(b=>b.onclick=()=>{st.sv=Math.max(1,Math.min(12,st.sv+ +b.dataset.sv));draw()});
    box.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>{const o=document.getElementById('optBox');const k=b.dataset.opt;
      if(k==='portions'){st.sv=S.settings.people||1;draw();return}if(k==='next'){st.week='next';toast('Will be added to next week instead');draw();return}
      if(k==='cheaper'){o.innerHTML=`<div class="picker" style="margin-top:8px">${sim.options.cheaper.map(x=>`<button class="pick" data-swap="${esc(x.id)}"><span class="rn">${esc(x.name)}</span><span class="m num">${money(recipeCost(x))}/serving · ${x.minutes} min</span></button>`).join('')}</div>`;o.querySelectorAll('[data-swap]').forEach(p=>p.onclick=()=>{closeModal();openAddFlow(p.dataset.swap,{day:st.day,meal:st.meal,sv:st.sv})})}
      if(k==='replace'){o.innerHTML=`<div class="picker" style="margin-top:8px">${sim.options.replace.map((e,i)=>`<button class="pick" data-rep="${i}"><span class="rn">${esc(e.recipe.name)}</span><span class="m num">${DAYS[e.day]} ${e.meal} · ${money(e.cost)}</span></button>`).join('')}</div>`;o.querySelectorAll('[data-rep]').forEach(p=>p.onclick=()=>{const e=sim.options.replace[+p.dataset.rep];st.day=e.day;st.meal=e.meal;draw()})}
      if(k==='optional'){o.innerHTML=`<div class="picker" style="margin-top:8px">${sim.options.removeOptional.filter(c=>c.line.items.length&&!st.postpone.includes(c.line.items[0].id)).map(c=>`<button class="pick plain" data-pp="${esc(c.line.items[0].id)}"><span class="rn">${esc(c.line.name)}</span><span class="m num">${c.prio} · saves ${money(c.line.cost)}</span></button>`).join('')||'<div class="small faint">Only essentials are left on the list.</div>'}</div>`;o.querySelectorAll('[data-pp]').forEach(p=>p.onclick=()=>{st.postpone.push(p.dataset.pp);draw()})}});
    document.getElementById('addConfirm').onclick=()=>{const saved=ensureSaved(r);const targetKey=st.week==='next'?iso(addDays(parseISO(S.ui.weekKey),7)):S.ui.weekKey;const wk=week(targetKey);addEntry(st.day,st.meal,{t:'r',id:saved.id,sv:st.sv},true,wk);if(st.week!=='next'){wk.buy=wk.buy||{};for(const i of st.postpone)wk.buy[i]=false}saveWeek(targetKey);closeModal();
      if(S.ui.disc.slot)S.ui.disc.slot=null;toast(`${saved.name} added to ${DAYS_LONG[st.day]} ${st.meal}${st.week==='next'?' next week':''}. Grocery list updated.`);if(pre.thenPlan!==false&&st.week!=='next'){S.ui.tab='plan';renderNav()}render()}};
  draw()}
function addMissingToGroceries(id,sv){const r=getRecipe(id);if(!r)return;const inv=invIndex();const wk=week();wk.extras=wk.extras||[];let n=0;const scale=(sv||S.settings.people||1)/(r.servings||1);for(const i of (r.ingredients||[])){if(inv[canon(i.name)])continue;wk.extras.push({id:uid('x'),name:i.name,qty:Math.round((+i.qty||0)*scale*100)/100,unit:i.unit||'',category:i.category||guessCat(i.name),price:Math.round((+i.price||0)*scale*100)/100,priority:'preferred',fromRecipe:r.id});n++}saveWeek();toast(n?`${n} ingredient${n===1?'':'s'} added to this week's list`:'Everything is already at home')}

function openCreateChooser(slot){openModal(`${mhead('Create a recipe','Three ways in. Everything ends in the same editor so you can check quantities and prices.')}<div class="mb picker">
  <button class="pick" data-action="new-recipe" ${slot?`data-day="${slot.day}" data-meal="${slot.meal}"`:''}><span class="rn">Enter manually</span><span class="m">type ingredients and steps</span></button>
  <button class="pick" data-action="url-import" ${slot?`data-day="${slot.day}" data-meal="${slot.meal}"`:''}><span class="rn">Import from URL</span><span class="m">a recipe page you found online</span></button>

function openAiCreate(slot){const s=S.settings;openModal(`${mhead('Create with AI','Claude drafts a structured recipe from your brief. It is validated, then you review prices and quantities before saving. Labelled as created for you.')}<div class="mb">
    <div class="row"><div class="field"><label for="cMeal">Meal type</label><select id="cMeal">${MEAL_TYPES.map(m=>`<option value="${m}" ${(slot&&slot.meal===m)||(!slot&&m==='dinner')?'selected':''}>${MEAL_LABEL[m]}</option>`).join('')}</select></div><div class="field"><label for="cServ">Servings</label><input id="cServ" type="number" min="1" max="12" value="${s.people||1}"></div><div class="field"><label for="cTime">Max prep + cook (min)</label><input id="cTime" type="number" min="5" step="5" value="30"></div></div>
    <div class="row"><div class="field"><label for="cBud">Budget per serving (${esc(s.currency)})</label><input id="cBud" type="number" min="0" step="0.5" value="${Math.round(discoverContext().threshold*2)/2}"></div><div class="field"><label for="cCui">Cuisine</label><input id="cCui" placeholder="any, or e.g. Thai"></div><div class="field"><label for="cNut">Nutrition preference</label><select id="cNut"><option value="">Balanced</option><option>High protein</option><option>Lower calorie</option><option>High fibre</option><option>Comfort food</option></select></div></div>
    <div class="row"><div class="field"><label for="cUse">Ingredients to use</label><input id="cUse" placeholder="e.g. spinach, eggs (what you have)"></div><div class="field"><label for="cNo">Ingredients to avoid</label><input id="cNo" placeholder="e.g. mushrooms"></div></div>
    <div class="field"><label for="cDiet">Dietary requirements</label><input id="cDiet" value="${esc((s.allergies||[]).length?'no '+s.allergies.join(', no '):'')}" placeholder="e.g. vegetarian, gluten-free"></div>
    ${s.diet?`<div class="small faint">Your standing preferences are included: “${esc(s.diet.slice(0,120))}${s.diet.length>120?'…':''}”</div>`:''}<div id="aiOut"></div></div>
    <div class="mf"><button class="btn ghost" data-close>Cancel</button><div class="actions"><button class="btn ghost" id="aiStop" hidden>Stop</button><button class="btn primary" id="aiGo">${ICONS.spark} Draft recipe</button></div></div>`);
  let ctl=null;document.getElementById('aiStop').onclick=()=>ctl&&ctl.abort();
  document.getElementById('aiGo').onclick=async()=>{if(!sampleFn)return;const g=id=>document.getElementById(id).value.trim();const out=document.getElementById('aiOut'),go=document.getElementById('aiGo'),stop=document.getElementById('aiStop');out.innerHTML='<div class="thinking"><span class="sp"></span>Drafting…</div>';go.disabled=true;stop.hidden=false;ctl=new AbortController();
    const inv=Object.values(S.inventory).map(v=>v.name).slice(0,25).join(', ');
    const prompt=`Create one original home-cook recipe.\nMeal type: ${g('cMeal')}. Servings: ${g('cServ')}. Maximum total time: ${g('cTime')} minutes. Target cost per serving: ${s.currency}${g('cBud')} at typical supermarket prices${s.store?' ('+s.store+')':''}.\n${g('cCui')?'Cuisine: '+g('cCui')+'.\n':''}${g('cNut')?'Nutrition preference: '+g('cNut')+'.\n':''}${g('cUse')?'Use these ingredients: '+g('cUse')+'.\n':''}${g('cNo')?'Avoid: '+g('cNo')+'.\n':''}${g('cDiet')?'Dietary requirements (strict): '+g('cDiet')+'.\n':''}${(s.allergies||[]).length?'ALLERGIES, never include: '+s.allergies.join(', ')+'.\n':''}${s.diet?'Standing preferences: '+s.diet+'\n':''}${inv?'Already at home (prefer using): '+inv+'\n':''}Use metric units and realistic quantities. Include a one-sentence description, storage guidance and a leftover tip in notes.\n\n${RECIPE_SHAPE().replace('"notes":string (leftover or storage tip, may be empty)','"description":string,"storage":string,"leftovers":string,"cuisine":string,"freezerFriendly":boolean,"notes":string')}`;
    try{const j=await sampleFn.json(prompt,{signal:ctl.signal,cache:false});const r=coerceRecipe(j);r.description=String(j.description||'').slice(0,280);r.storage=String(j.storage||'');r.leftovers=String(j.leftovers||'');r.cuisine=String(j.cuisine||g('cCui')||'');r.freezerFriendly=!!j.freezerFriendly;r.source={type:'ai',name:'Created for you by Claude',createdAt:Date.now()};const viol=violatesAllergies(r);
      if(viol.length){out.innerHTML=`<div class="note bad">The draft contained ${esc(viol.join(', '))}, which is on your allergy list, so it was not saved. Try again with a different brief.</div>`;return}
      closeModal();openEditor(r,{sub:'Review, then save',notice:'Created for you by Claude from your brief. It is not from a website. Check quantities and prices before saving.',then:slot?saved=>{addEntry(slot.day,slot.meal,{t:'r',id:saved.id,sv:S.settings.people||1},true);saveWeek();S.ui.tab='plan';renderNav();render()}:null})}
    catch(e){if(e&&e.code==='cancelled')out.innerHTML='';else out.innerHTML=`<div class="note bad">${aiErr(e)}</div>`}finally{go.disabled=false;stop.hidden=true}}}
function openUrlImport(slot){const prov=activeProvider();
  openModal(`${mhead('Import a recipe from a URL','Only Schema.org recipe data is used, and the source name and link are kept with the recipe.')}<div class="mb">
    <div class="field"><label for="uUrl">Recipe page address</label><input id="uUrl" type="url" placeholder="https://…" inputmode="url"></div>
    ${prov.live?'<div class="small faint">The page is fetched by your recipe service, not by this browser.</div>':`<div class="note">This copy of Plenty cannot fetch websites itself (the published page has no internet access). Two ways that work here:<br>1. Open the page, select all (Ctrl/Cmd+A), copy, and paste the text below. Claude structures it and keeps the link as the source.<br>2. Paste the page source (View source → copy) and Plenty reads the Schema.org recipe data directly, no AI needed.</div><div class="field"><label for="uPaste">Pasted recipe text or page source</label><textarea id="uPaste" style="min-height:140px" placeholder="Paste here"></textarea></div>`}
    <div id="uOut"></div></div>
    <div class="mf"><button class="btn ghost" data-close>Cancel</button><div class="actions"><button class="btn" data-action="new-recipe" ${slot?`data-day="${slot.day}" data-meal="${slot.meal}"`:''}>Enter manually instead</button><button class="btn primary" id="uGo">Import</button></div></div>`);
  const then=slot?saved=>{addEntry(slot.day,slot.meal,{t:'r',id:saved.id,sv:S.settings.people||1},true);saveWeek();S.ui.tab='plan';renderNav();render()}:null;
  const finish=(parsed,src)=>{const {recipe,partial,missing}=parsed;if(!recipe){document.getElementById('uOut').innerHTML=`<div class="note bad">Import did not succeed: ${esc(missing.join(' and '))} ${missing.length===1?'is':'are'} missing from the page's recipe data${partial&&partial.name?` (found: “${esc(partial.name)}”)`:''}. Enter it manually, or paste the recipe text for Claude to structure.</div>`;return}
    closeModal();openEditor(recipe,{sub:'Review the import, then save',notice:`Imported from ${esc(src&&src.name||recipe.source.name||'the web')}${missing.length?`. Missing from the page: ${esc(missing.join(', '))}; add them below.`:'. Check quantities, units, categories and prices.'}`,then})};
  document.getElementById('uGo').onclick=async()=>{const url=document.getElementById('uUrl').value.trim();const out=document.getElementById('uOut');const paste=document.getElementById('uPaste')?document.getElementById('uPaste').value.trim():'';
    let host='';try{host=new URL(url).hostname.replace(/^www\./,'')}catch(e){}
    if(paste){const nodes=extractJsonLd(paste);if(nodes.length){finish(parseJsonLdRecipe(nodes[0],{name:host||'pasted page',url}),{name:host||'pasted page'});return}
      if(!sampleFn){out.innerHTML='<div class="note bad">No Schema.org recipe data was found in the pasted text, and Claude is not available here to structure plain text. Enter it manually.</div>';return}
      out.innerHTML='<div class="thinking"><span class="sp"></span>Structuring the pasted recipe…</div>';
      try{const j=await sampleFn.json(`Convert this recipe text into structured data. Keep the author's ingredients and steps faithfully; normalise to metric where weights or volumes are given, otherwise use pcs. Estimate per-ingredient prices in ${S.settings.currency} and nutrition per serving only if the text does not give them.\n\n${RECIPE_SHAPE()}\n\nRECIPE TEXT:\n${paste.slice(0,20000)}`,{cache:false});const r=coerceRecipe(j);r.source={type:'import',name:host||'pasted text',url,importedAt:Date.now(),via:'text'};closeModal();openEditor(r,{sub:'Review the import, then save',notice:`Structured by Claude from text you pasted${host?' from '+esc(host):''}. Check it before saving.`,then})}
      catch(e){out.innerHTML=`<div class="note bad">${aiErr(e)}</div>`}return}
    if(!url){out.innerHTML='<div class="note bad">Paste a web address first.</div>';return}
    if(!prov.live){out.innerHTML='<div class="note bad">This copy cannot fetch that page. Paste the recipe text or page source above instead.</div>';return}
    out.innerHTML='<div class="thinking"><span class="sp"></span>Fetching the page…</div>';
    try{const res=await prov.importUrl(url);if(res.error){out.innerHTML=`<div class="note bad">${esc(res.error)} You can paste the recipe text instead, or enter it manually.</div>`;return}finish(parseJsonLdRecipe(res.jsonld[0],res.source),res.source)}
    catch(e){out.innerHTML=`<div class="note bad">${esc(e.message||'The import failed.')} Try again, or enter the recipe manually.</div>`}}}

    <div class="row"><div class="field"><label for="tDate">Shopping date</label><input id="tDate" type="date" value="${iso(t)}" required></div><div class="field"><label for="tStore">Store</label><input id="tStore" value="${esc(S.settings.store||'')}" placeholder="e.g. Aldi" list="storeList"><datalist id="storeList">${[...new Set(Object.values(S.weeks).flatMap(w=>(w.trips||[]).map(x=>x.store)).filter(Boolean))].map(s=>`<option value="${esc(s)}">`).join('')}</datalist></div></div>
    <div class="row"><div class="field"><label for="tAmt">Actual total (${esc(S.settings.currency)})</label><input id="tAmt" type="number" step="0.01" min="0" value="${amount||''}" placeholder="0.00" required></div><div class="field"><label for="tTax">Tax included</label><input id="tTax" type="number" step="0.01" min="0" placeholder="0.00"></div><div class="field"><label for="tDisc">Discounts</label><input id="tDisc" type="number" step="0.01" min="0" placeholder="0.00"></div></div>
    <div class="field"><label for="tNote">Notes</label><input id="tNote" placeholder="optional"></div>
    ${!db?`<div class="field"><label for="tPhoto">Receipt photo <span class="faint" style="font-weight:400">optional, kept only on this device, removable</span></label><input id="tPhoto" type="file" accept="image/*" capture="environment" style="${fieldCss}"></div>`:''}
    <label class="checks" style="display:flex"><input type="checkbox" id="tMark" checked> Mark every ticked list item as bought (updates stock and pet supplies)</label>
    <div class="small faint">Estimate for this week: ${money(B.actual)}${B.spent?` · already logged ${money(B.spent)}`:''}. The estimate is kept for comparison.</div></form>
    <div class="mf"><span class="actions" style="margin-left:0">${sampleFn?`<button class="btn ai-only" data-action="receipt-scan">${ICONS.spark} Scan a receipt</button>`:'<span class="small faint">Automatic receipt reading needs a secure AI service and is not available in this version.</span>'}<button class="btn" data-action="receipt-manual">Enter line items</button></span><div class="actions"><button class="btn ghost" data-close>Cancel</button><button class="btn primary" type="submit" form="shopForm">Save trip</button></div></div>`);

    const ph=document.getElementById('tPhoto');if(ph&&ph.files&&ph.files[0]&&Store.backend&&Store.profileId){try{const imgId=uid('img');await Store.putBlob(imgId,ph.files[0],{tripId:trip.id});trip.imageId=imgId}catch(err){console.warn(err);toast('The photo could not be stored; the trip is saved without it.')}}
    if(document.getElementById('tMark').checked)for(const l of buildList())if(l.checked)markBought(l,trip.date);saveTrip(trip);closeModal();toast('Trip saved')}}
async function openTripPhoto(tripId){const wk=week();const tr=(wk.trips||[]).find(t=>t.id===tripId);if(!tr||!tr.imageId)return;const rec=await Store.getBlob(tr.imageId);if(!rec||!rec.blob){toast('The photo is no longer stored.');return}const url=URL.createObjectURL(rec.blob);openModal(`${mhead('Receipt photo',`${esc(tr.store||'Shop')} · ${fmtDate(parseISO(tr.date))} · stored only on this device`)}<div class="mb"><img src="${url}" alt="Receipt" style="max-width:100%;border-radius:8px">${typeof accountPhotoControlsHtml==='function'?accountPhotoControlsHtml(tr):''}</div><div class="mf"><button class="btn ghost danger" data-action="trip-photo-remove" data-id="${esc(tr.id)}">Remove photo</button><div class="actions"><button class="btn" data-close>Close</button></div></div>`);const ov=document.querySelector('.overlay');if(ov)ov.addEventListener('click',()=>setTimeout(()=>URL.revokeObjectURL(url),500),{once:true})}
async function removeTripPhoto(tripId){for(const k in S.weeks){const tr=(S.weeks[k].trips||[]).find(t=>t.id===tripId);if(tr&&tr.imageId){try{await Store.delBlob(tr.imageId)}catch(e){}delete tr.imageId;writeDoc('weeks/'+k,S.weeks[k])}}render()}
function saveTrip(trip){const wk=week(trip.date?iso(mondayOf(parseISO(trip.date))):S.ui.weekKey);wk.trips=wk.trips||[];wk.trips.push(trip);const key=iso(mondayOf(parseISO(trip.date)));if(key!==S.ui.weekKey)writeDoc('weeks/'+key,wk);else saveWeek()}
let receiptFile=null;
async function openReceiptScan(){if(!sampleFn){toast('Claude is not available here.');return}const caps=await sampleFn.limits().catch(()=>null);if(!caps||!caps.images){toast('Photo reading is not available on this device.');return}
